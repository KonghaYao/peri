[package]
name = "peri-tui"
version.workspace = true
edition = "2024"
description = "TUI interface for Rust Agent - interactive terminal playground"

[lib]
name = "peri_tui"
path = "src/lib.rs"

[[bin]]
name = "peri"
path = "src/main.rs"

[features]
headless = []
# S12 起 use-kit 成为默认路径。Legacy runtime/state_machine/ui/panel 代码
# 仍保留编译能力（通过 --no-default-features 启用），便于 S13 渐进删除。
default = ["use-kit"]
use-kit = []

[dev-dependencies]
tempfile.workspace = true
serial_test.workspace = true
[dependencies]
serde.workspace = true
peri-agent = { path = "../peri-agent" }
peri-middlewares = { path = "../peri-middlewares" }
peri-lsp = { path = "../peri-lsp" }
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info", "unstable-widget-ref"] }
ratatui-kit = { version = "0.10.1", features = ["full"] }
ratatui-kit-markdown = { path = "../../ratatui-kit-contrib/crates/ratatui-kit-markdown", features = ["markdown-highlight"] }
tokio.workspace = true
tokio-util.workspace = true
anyhow.workspace = true
chrono.workspace = true
uuid = { workspace = true, features = ["v7"] }
serde_json.workspace = true
async-trait.workspace = true
tracing.workspace = true
dirs-next.workspace = true
parking_lot.workspace = true
arboard = "3"
png = "0.18"
base64 = { version = "0.22", features = ["alloc"] }
peri-widgets = { path = "../peri-widgets" }
peri-acp = { path = "../peri-acp" }
peri-acp-types = { path = "../peri-acp-types" }
peri-web-pty = { path = "../peri-web-pty" }
agent-client-protocol = { version = "1.2", features = ["unstable"] }
agent-client-protocol-schema = { version = "1.4", features = ["unstable_elicitation"] }
unicode-width = "0.2"
unicode-segmentation = "1"
clap = { version = "4", features = ["derive"] }
sysinfo.workspace = true
fluent = "0.17"
fluent-bundle = "0.16"
unic-langid = { version = "0.9", features = ["macros"] }
tokio-tungstenite = { workspace = true, features = ["rustls-tls-native-roots"] }
aes-gcm = "0.11"
ring = "0.17"
rmp-serde = "1.3"
thiserror.workspace = true
futures-util = "0.3"
fuzzy-matcher = "0.3"
im = "15"

[target.'cfg(not(target_os = "windows"))'.dependencies]
tikv-jemallocator.workspace = true
tikv-jemalloc-ctl.workspace = true
tikv-jemalloc-sys.workspace = true
