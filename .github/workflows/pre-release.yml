name: Build Next Major

on:
    push:
        branches: [pre-release/main]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false

env:
    CARGO_TERM_COLOR: always

jobs:
    build:
        name: Build (${{ matrix.platform }})
        if: github.ref == 'refs/heads/pre-release/main'
        runs-on: ${{ matrix.os }}
        timeout-minutes: 60
        defaults:
            run:
                shell: bash
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: ubuntu-24.04
                      target: x86_64-unknown-linux-gnu
                      platform: linux-x86_64
                    - os: ubuntu-24.04-arm
                      target: aarch64-unknown-linux-gnu
                      platform: linux-aarch64
                    - os: macos-15-intel
                      target: x86_64-apple-darwin
                      platform: macos-x86_64
                    - os: macos-14
                      target: aarch64-apple-darwin
                      platform: macos-aarch64

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: ${{ matrix.target }}

            - name: Cache Rust build
              uses: Swatinem/rust-cache@v2
              with:
                  key: next-major-${{ matrix.target }}

            - name: Build peri
              run: cargo build --locked -p peri-tui --bin peri --release --target ${{ matrix.target }}

            - name: Smoke test binary
              run: |
                  mkdir -p dist/package
                  cp target/${{ matrix.target }}/release/peri dist/package/peri-beta
                  dist/package/peri-beta --version

            - name: Package binary
              env:
                  PLATFORM: ${{ matrix.platform }}
                  TARGET: ${{ matrix.target }}
              run: |
                  tar -czf "dist/peri-beta-${PLATFORM}.tar.gz" -C dist/package peri-beta
                  (
                      cd dist
                      shasum -a 256 "peri-beta-${PLATFORM}.tar.gz" > "peri-beta-${PLATFORM}.tar.gz.sha256"
                  )
                  {
                      echo "Branch: $GITHUB_REF_NAME"
                      echo "Commit: $GITHUB_SHA"
                      echo "Run: $GITHUB_RUN_ID (attempt $GITHUB_RUN_ATTEMPT)"
                      echo "Target: $TARGET"
                      dist/package/peri-beta --version
                      rustc --version
                  } > "dist/build-info-${PLATFORM}.txt"
                  rm -rf dist/package

            - name: Upload artifact
              uses: actions/upload-artifact@v4
              with:
                  name: peri-beta-${{ matrix.platform }}-${{ github.sha }}
                  path: |
                      dist/*.tar.gz
                      dist/*.sha256
                      dist/build-info-*.txt
                  if-no-files-found: error
                  compression-level: 0
                  retention-days: 14

    publish:
        name: Publish peri-beta
        needs: build
        runs-on: ubuntu-24.04
        permissions:
            contents: write
        defaults:
            run:
                shell: bash
        steps:
            - name: Download beta artifacts
              uses: actions/download-artifact@v4
              with:
                  pattern: peri-beta-*-${{ github.sha }}
                  path: dist
                  merge-multiple: true

            - name: Verify all packages
              run: |
                  for platform in linux-x86_64 linux-aarch64 macos-x86_64 macos-aarch64; do
                      (cd dist && sha256sum --check "peri-beta-${platform}.tar.gz.sha256")
                      test "$(tar -tzf "dist/peri-beta-${platform}.tar.gz")" = peri-beta
                  done

            - name: Publish rolling beta prerelease
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
              run: |
                  printf 'Development build from pre-release/main.\n\nCommit: %s\nRun: %s/actions/runs/%s\n' \
                    "$GITHUB_SHA" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > notes.md
                  if gh release view peri-beta --json isPrerelease --jq '.isPrerelease' > prerelease.txt; then
                      test "$(cat prerelease.txt)" = true
                      gh release upload peri-beta dist/* --clobber
                      gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/peri-beta" \
                        -f sha="$GITHUB_SHA" -F force=true
                      gh release edit peri-beta --title 'Peri Beta' --prerelease --latest=false --notes-file notes.md
                  else
                      gh release create peri-beta dist/* --target "$GITHUB_SHA" \
                        --title 'Peri Beta' --prerelease --latest=false --notes-file notes.md
                  fi
