name: CI

on:
    push:
        branches: [main, pre-release/main]
    pull_request:
        branches: [main, pre-release/main]

# 同一 PR 只保留最新运行；各分支的每次 push 仍独立验证。
concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
    CARGO_TERM_COLOR: always
    # CI 关闭增量编译：减少 15-25% 编译时间并避免写入会被 rust-cache 清理掉的 incremental 目录。
    CARGO_INCREMENTAL: "0"
    # 仅关闭 CI 调试信息，减少编译、链接与缓存开销；保留断言和溢出检查。
    CARGO_PROFILE_DEV_DEBUG: "0"
    CARGO_PROFILE_TEST_DEBUG: "0"
    # 固定缓存代数：升级链接器/补丁缓存策略时整体切换，避免混用旧缓存。
    PERI_CACHE_GEN: v3

jobs:
    # 变更分类：只有全部受影响路径都落在「已确认不影响构建与测试」的文档白名单内，
    # 才跳过 Rust 三平台任务。判定规则与白名单见 scripts/ci-classify-changes.sh。
    changes:
        name: Classify changes
        runs-on: ubuntu-latest
        timeout-minutes: 5
        outputs:
            docs_only: ${{ steps.classify.outputs.docs_only }}
            reason: ${{ steps.classify.outputs.reason }}
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - name: Check feature and authority documentation
              run: |
                  python3 scripts/test-feature-catalog.py
                  python3 scripts/check-feature-catalog.py

            - name: Classify changed paths
              id: classify
              env:
                  EVENT_NAME: ${{ github.event_name }}
                  PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
                  PUSH_BEFORE_SHA: ${{ github.event.before }}
                  CI_HEAD_SHA: ${{ github.sha }}
              run: bash scripts/ci-classify-changes.sh

    # 复用发布的锁定构建与摘要校验，只验证 pin，不上传发布归档所需的 Sidecar。
    workflow-sidecar:
        name: Workflow sidecar
        needs: changes
        if: needs.changes.outputs.docs_only != 'true'
        uses: ./.github/workflows/workflow-sidecar.yml
        with:
            upload_artifact: false

    # 保留历史 job ID 和名称，避免分支保护与检查标识漂移。本 job 只运行测试和轻量门禁。
    build:
        name: Build (${{ matrix.os }})
        needs: changes
        if: needs.changes.outputs.docs_only != 'true'
        runs-on: ${{ matrix.runner }}
        # 冷缓存需要余量：实测 Windows 冷编译+测试约 40 分钟，macOS 约 34 分钟；热缓存远低于此值。
        timeout-minutes: 60
        strategy:
            fail-fast: false
            matrix:
                # Linux 固定 ubuntu-24.04 与 e2e-replay 对齐（os 保持 ubuntu-latest 不改变检查名）
                include:
                    - os: ubuntu-latest
                      runner: ubuntu-24.04
                      target: x86_64-unknown-linux-gnu
                      cache_key: linux-x86_64
                    - os: macos-latest
                      runner: macos-latest
                      target: aarch64-apple-darwin
                      cache_key: macos-aarch64
                    - os: windows-latest
                      runner: windows-latest
                      target: x86_64-pc-windows-msvc
                      cache_key: windows-x86_64

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            # 平台无关的源码检查只在 Linux 执行，并在工具链和缓存恢复前快速失败。
            - name: Check §0 layer imports
              if: runner.os == 'Linux'
              run: bash scripts/check-layer-imports.sh

            - name: Check MCP data boundary
              if: runner.os == 'Linux'
              run: bash scripts/check-mcp-data-boundary.sh

            - name: Check TUI component boundary
              if: runner.os == 'Linux'
              run: |
                  python3 scripts/test-tui-components.py
                  python3 scripts/check-tui-components.py

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@master
              with:
                  toolchain: 1.99.0
                  targets: ${{ matrix.target }}

            - name: Test CI test inventory parser
              if: runner.os == 'Linux'
              run: python3 scripts/test-ci-test-inventory.py

            - name: Test Loom state import tool
              if: runner.os == 'Linux'
              run: python3 peri-swarm/scripts/test-import-loom-state.py

            - name: Verify test inventory
              if: runner.os == 'Linux'
              run: bash scripts/ci-test-inventory.sh --check

            # ==================================================================
            # 加速点 1：快速链接器（大幅缩短 50+ 测试二进制链接耗时）
            # - Linux: clang + mold（链接提速 5-10x）
            # - Windows: 优先使用预装 lld-link（链接提速 2-4x）
            # - macOS: Apple ld_prime 本身很快，无需额外配置
            # 必须在 Swatinem/rust-cache 之前写入 GITHUB_ENV，确保 cache key 纳入链接器配置。
            # ==================================================================
            - name: Setup fast linker (Linux - mold)
              if: runner.os == 'Linux'
              run: |
                  sudo apt-get update -qq
                  sudo apt-get install -y --no-install-recommends mold clang
                  echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER=clang" >> "$GITHUB_ENV"
                  echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS=-C link-arg=-fuse-ld=mold" >> "$GITHUB_ENV"

            - name: Setup fast linker (Windows - lld-link)
              if: runner.os == 'Windows'
              shell: bash
              run: |
                  if command -v lld-link >/dev/null 2>&1; then
                      echo "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=lld-link" >> "$GITHUB_ENV"
                  elif [[ -x "/c/Program Files/LLVM/bin/lld-link.exe" ]]; then
                      echo "/c/Program Files/LLVM/bin" >> "$GITHUB_PATH"
                      echo "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=lld-link" >> "$GITHUB_ENV"
                  fi

            # ==================================================================
            # 加速点 2（核心根因修复）：独立缓存补丁 crate 并固化 mtime + 写入全局 CARGO_HOME/config.toml
            # 原问题：Swatinem/rust-cache 只缓存 target/debug/{deps,build,.fingerprint}，
            # 不会保存 target/peri-*-patches/。每轮 CI 运行 cargo-rmcp-patched.sh 都会重新下载解压
            # hyper-util / rmcp，文件 mtime 变成当前时间（比恢复的 .fingerprint 更新），
            # 导致 Cargo 判定 hyper-util -> reqwest -> axum -> rmcp 及全部下游 workspace 过期并全量重编！
            # 修复：
            #   1) 用 actions/cache/restore+save 单独缓存补丁目录（~2MB，秒级恢复）；
            #   2) 把补丁源码 mtime 统一设为固定过去时间（2020-01-01），永远早于 .fingerprint；
            #   3) 把生成的 [patch.crates-io] 一次性写入 $CARGO_HOME/config.toml：
            #      - rust-cache 的 cargo metadata 原生通过，不再依赖 cmd-format 包装；
            #      - 后续 5 个测试步骤（1 次主调用 + 4 次逐 binary 门禁）直接调用 cargo，
            #        省去逐步骤重复的 python3 + patch -R + config 重写。
            # ==================================================================
            - name: Restore patched crates cache
              id: patches-cache
              uses: actions/cache/restore@v4
              with:
                  path: |
                      target/peri-rmcp-patches
                      target/peri-hyper-util-patches
                  key: ${{ matrix.cache_key }}-peri-patches-${{ hashFiles('patches/*.patch', 'scripts/cargo-rmcp-patched.sh') }}

            - name: Materialize patched crates & install Cargo patch config
              shell: bash
              run: bash scripts/ci-materialize-patches.sh

            - name: Save patched crates cache
              if: steps.patches-cache.outputs.cache-hit != 'true'
              uses: actions/cache/save@v4
              with:
                  path: |
                      target/peri-rmcp-patches
                      target/peri-hyper-util-patches
                  key: ${{ steps.patches-cache.outputs.cache-primary-key }}

            # ==================================================================
            # 加速点 3：统一三平台依赖缓存，Linux 与 e2e-replay 共享同一 shared-key
            # 由于 $CARGO_HOME/config.toml 已生效，rust-cache 原生 cargo metadata 直接成功；
            # 仅默认分支写入基线缓存，避免 PR 刷爆 10GB 缓存配额。
            # ==================================================================
            - name: Cache cargo registry and build
              uses: Swatinem/rust-cache@v2
              with:
                  shared-key: ${{ matrix.cache_key }}-peri-${{ env.PERI_CACHE_GEN }}
                  save-if: ${{ github.ref == 'refs/heads/main' }}

            # rust-cache 恢复 target/ 后 target/peri-*-patches 会消失，而 config.toml
            # 指向这些目录；不重新物化则 cargo metadata 报 patch location 不含对应 crate。
            - name: Re-materialize patched crates after cache restore
              shell: bash
              run: bash scripts/ci-materialize-patches.sh

            # 固定 nextest 版本：三平台均由 GitHub Releases 预编译安装。
            - name: Install cargo-nextest
              uses: taiki-e/install-action@v2
              with:
                  tool: nextest@0.9.148

            # ==================================================================
            # 测试执行：1 次主调用跑全部目标（除 Compact 四套对抗），4 套对抗各自再跑
            # 一次作为逐 binary 非零门禁——合并成 union 时 `--no-tests=fail` 只约束合并
            # 结果，其中一套命中零例会静默通过。不再单独 `--no-run` 预编译：nextest 的
            # 构建阶段不参与过滤，主调用自身会完成同一份编译，预编译只是重复一次 cargo
            # 选择校验，不减少工作量。
            # `--profile ci` 提供单测试超时、50m 全局上限与不重试，见 .config/nextest.toml。
            # 执行范围与 scripts/ci-test-inventory.sh --check 相互校验。
            # ==================================================================
            - name: Run workspace tests (all targets except Compact adversarial suites)
              shell: bash
              run: >-
                  cargo nextest run --locked --workspace --profile ci --no-tests=fail
                  -E 'not (package(=peri-agent) & binary(=compact_pressure_adversarial_test)
                  | package(=peri-agent) & binary(=compact_session_adversarial_test)
                  | package(=peri-agent) & binary(=compact_session_manual_adversarial_test)
                  | package(=peri-agent) & binary(=compact_authority_projection_test))'

            - name: Run PostgreSQL session and Swarm state contracts
              if: runner.os == 'Linux'
              shell: bash
              run: |
                  db=$(docker run -d --rm -p 127.0.0.1::5432 -e POSTGRES_HOST_AUTH_METHOD=trust postgres:17-alpine)
                  trap 'docker stop "$db" >/dev/null' EXIT
                  for _ in {1..60}; do
                    docker exec "$db" pg_isready -q -U postgres && break
                    sleep 1
                  done
                  address=$(docker port "$db" 5432/tcp)
                  export PERI_TEST_POSTGRES_URL="postgresql://postgres@${address}/postgres"
                  cargo test --locked -p peri-resources --lib -- --ignored sessions::remote:: --test-threads=2
                  # Swarm state store: schema init, idempotent receipts, cursor resume,
                  # fail-closed recovery and concurrent delete. Every case owns a private
                  # schema, so the two suites can share one instance.
                  cargo test --locked -p peri-swarm --lib -- --ignored store::postgres --test-threads=2
                  # HTTP delete of a `type=none` session needs a real state database that
                  # is not the session database, so it gets its own two databases.
                  docker exec "$db" psql -U postgres -qc 'CREATE DATABASE peri_swarm_session'
                  docker exec "$db" psql -U postgres -qc 'CREATE DATABASE peri_swarm_state'
                  export PERI_SWARM_SESSION_STORE="postgresql://postgres@${address}/peri_swarm_session"
                  export PERI_SWARM_STATE_STORE="postgresql://postgres@${address}/peri_swarm_state"
                  cargo test --locked -p peri-swarm --test it -- --ignored state_store_none_delete

            - name: Run Compact adversarial suite (compact_pressure_adversarial_test)
              shell: bash
              run: >-
                  cargo nextest run --locked --workspace --profile ci --no-tests=fail
                  -E 'package(=peri-agent) & binary(=compact_pressure_adversarial_test)'

            - name: Run Compact adversarial suite (compact_session_adversarial_test)
              shell: bash
              run: >-
                  cargo nextest run --locked --workspace --profile ci --no-tests=fail
                  -E 'package(=peri-agent) & binary(=compact_session_adversarial_test)'

            - name: Run Compact adversarial suite (compact_session_manual_adversarial_test)
              shell: bash
              run: >-
                  cargo nextest run --locked --workspace --profile ci --no-tests=fail
                  -E 'package(=peri-agent) & binary(=compact_session_manual_adversarial_test)'

            - name: Run Compact adversarial suite (compact_authority_projection_test)
              shell: bash
              run: >-
                  cargo nextest run --locked --workspace --profile ci --no-tests=fail
                  -E 'package(=peri-agent) & binary(=compact_authority_projection_test)'

            # 三个历史排除包（peri-acp / peri-tui / peri-middlewares）经核查只有 text/json/ignore
            # 形态的 fence，没有可执行 Rust doctest。不加 --exclude 才能与 nextest 主调用共享同一份
            # resolver=3 特性投影，避免 doctest 触发依赖重编；inventory 的 doctest_excluded 同步为空。
            - name: Run doctests (all workspace packages)
              shell: bash
              run: cargo test --doc --locked --workspace

    # 离线录放业务回归：修复缺失补丁配置导致的缓存失效，与 Build (ubuntu-latest) 共享
    # 同一套 Linux 依赖缓存 + mold 链接器，同时保持并行执行不拉长 PR 端到端耗时。
    e2e-replay:
        name: E2E replay (Linux)
        needs: changes
        if: needs.changes.outputs.docs_only != 'true'
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - name: Resolve peri-e2e revision
              id: e2e
              run: |
                  rev="$(cat .github/peri-e2e.rev)"
                  rev="${rev//[$'\r\n ']/}"
                  if [[ ! "$rev" =~ ^[0-9a-f]{40}$ ]]; then
                      echo "invalid peri-e2e pin: '$rev'（.github/peri-e2e.rev 须为 40 位小写 commit SHA）" >&2
                      exit 1
                  fi
                  echo "sha=$rev" >> "$GITHUB_OUTPUT"

            - name: Checkout peri-e2e at pinned revision
              uses: actions/checkout@v7
              with:
                  repository: KonghaYao/peri-e2e
                  ref: ${{ steps.e2e.outputs.sha }}
                  path: peri-e2e
                  persist-credentials: false

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@master
              with:
                  toolchain: 1.99.0

            - name: Setup fast linker (Linux - mold)
              run: |
                  sudo apt-get update -qq
                  sudo apt-get install -y --no-install-recommends mold clang
                  echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER=clang" >> "$GITHUB_ENV"
                  echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS=-C link-arg=-fuse-ld=mold" >> "$GITHUB_ENV"

            - name: Restore patched crates cache
              id: patches-cache
              uses: actions/cache/restore@v4
              with:
                  path: |
                      target/peri-rmcp-patches
                      target/peri-hyper-util-patches
                  key: linux-x86_64-peri-patches-${{ hashFiles('patches/*.patch', 'scripts/cargo-rmcp-patched.sh') }}

            - name: Materialize patched crates & install Cargo patch config
              run: bash scripts/ci-materialize-patches.sh

            - name: Save patched crates cache
              if: steps.patches-cache.outputs.cache-hit != 'true'
              uses: actions/cache/save@v4
              with:
                  path: |
                      target/peri-rmcp-patches
                      target/peri-hyper-util-patches
                  key: ${{ steps.patches-cache.outputs.cache-primary-key }}

            # 修复原 e2e-replay 缺失补丁配置导致 rust-cache 只存 ~11MB 的问题；
            # 使用独立 shared-key 以 100% 匹配 `-p peri-tui --bin peri` 的特性统一（避免与 --workspace 特性集漂移）。
            - name: Cache cargo registry and build
              uses: Swatinem/rust-cache@v2
              with:
                  shared-key: e2e-replay-linux-${{ env.PERI_CACHE_GEN }}
                  save-if: ${{ github.ref == 'refs/heads/main' }}

            # 同上：rust-cache 恢复 target/ 后补丁目录消失，构建前需重新物化。
            - name: Re-materialize patched crates after cache restore
              run: bash scripts/ci-materialize-patches.sh

            - name: Build peri binary
              run: cargo build --locked -p peri-tui --bin peri

            - name: Install Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm
                  cache-dependency-path: peri-e2e/package-lock.json

            - name: Install peri-e2e dependencies
              run: npm ci --prefix peri-e2e

            - name: Type-check replay harness
              run: npm --prefix peri-e2e run e2e:replay:check

            - name: Check world snapshot against this checkout
              env:
                  PERI_SOURCE_ROOT: ${{ github.workspace }}
              run: npm --prefix peri-e2e run e2e:replay:world-check

            - name: Run replay unit tests
              env:
                  PERI_SOURCE_ROOT: ${{ github.workspace }}
              run: npm --prefix peri-e2e run e2e:replay:unit

            - name: Verify replay fixtures
              env:
                  PERI_SOURCE_ROOT: ${{ github.workspace }}
              run: npm --prefix peri-e2e run e2e:replay:verify

            - name: Check replay catalog
              working-directory: peri-e2e
              run: |
                  rm -rf results/replay-v2/ci
                  node scripts/check-replay-catalog.mjs

            - name: Run offline replay (30 scenarios)
              env:
                  PERI_BINARY: ${{ github.workspace }}/target/debug/peri
                  PERI_E2E_REPLAY_RESULTS: ${{ github.workspace }}/peri-e2e/results/replay-v2/ci
                  PERI_SOURCE_ROOT: ${{ github.workspace }}
              run: npm --prefix peri-e2e run e2e:replay

            - name: Check replay results catalog
              working-directory: peri-e2e
              run: node scripts/check-replay-catalog.mjs --results results/replay-v2/ci

            - name: Upload replay evidence on failure
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: e2e-replay-results
                  path: peri-e2e/results/replay-v2
                  retention-days: 7
                  if-no-files-found: ignore

            - name: Print pinned peri-e2e revision
              if: always()
              run: |
                  printf 'peri-e2e pin: %s\n' "${{ steps.e2e.outputs.sha }}"
                  printf 'peri-e2e HEAD: %s\n' "$(git -C peri-e2e rev-parse HEAD)"

    # 汇总检查：保持原有稳定 job 名称，兼容分支保护规则。
    ci-result:
        name: CI result
        if: always()
        needs: [changes, workflow-sidecar, build, e2e-replay]
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - name: Summarize
              env:
                  CHANGES_RESULT: ${{ needs.changes.result }}
                  SIDECAR_RESULT: ${{ needs.workflow-sidecar.result }}
                  BUILD_RESULT: ${{ needs.build.result }}
                  E2E_RESULT: ${{ needs.e2e-replay.result }}
                  DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
                  DOCS_REASON: ${{ needs.changes.outputs.reason }}
              run: |
                  set -euo pipefail
                  printf 'changes=%s sidecar=%s build=%s e2e_replay=%s docs_only=%s\n' \
                      "$CHANGES_RESULT" "$SIDECAR_RESULT" "$BUILD_RESULT" "$E2E_RESULT" "$DOCS_ONLY"
                  printf 'reason: %s\n' "$DOCS_REASON"

                  if [[ "$CHANGES_RESULT" != "success" ]]; then
                      printf '::error::变更分类未成功（%s），无法确认能否跳过重型任务\n' "$CHANGES_RESULT" >&2
                      exit 1
                  fi

                  if [[ "$DOCS_ONLY" == "true" ]]; then
                      printf 'docs-only：按策略跳过 sidecar pin 校验、Rust 三平台测试与录放 E2E，汇总检查通过\n'
                      exit 0
                  fi

                  if [[ "$SIDECAR_RESULT" != "success" ]]; then
                      printf '::error::Workflow sidecar 结果 = %s（期望 success）\n' "$SIDECAR_RESULT" >&2
                      exit 1
                  fi

                  if [[ "$BUILD_RESULT" != "success" ]]; then
                      printf '::error::Rust 三平台任务结果 = %s（期望 success）\n' "$BUILD_RESULT" >&2
                      exit 1
                  fi

                  if [[ "$E2E_RESULT" != "success" ]]; then
                      printf '::error::E2E replay 结果 = %s（期望 success）\n' "$E2E_RESULT" >&2
                      exit 1
                  fi

                  printf '普通 CI 验证通过\n'
