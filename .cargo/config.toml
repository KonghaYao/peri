[target.arm-unknown-linux-gnueabihf]
linker = "arm-linux-gnueabihf-gcc"
ar = "arm-linux-gnueabihf-ar"
# Point to the Linaro toolchain sysroot
# CARGO_CFG_* are set via environment variables

[build]
# Disable cross-compile warnings as errors
rustflags = ["-C", "target-feature=-crt-static"]

[target.i686-unknown-linux-musl]
# The 32-bit Linux distribution is standalone, including the musl CRT.
rustflags = ["-C", "target-feature=+crt-static"]

[target.loongarch64-unknown-linux-musl]
# The 64-bit LoongArch distribution is standalone, including the musl CRT.
rustflags = ["-C", "target-feature=+crt-static"]
