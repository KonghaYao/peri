<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perihelion</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/theme.css">
  <style type="text/tailwindcss">
    /* ===== 浮层动画（keyframes，无法用工具类表达） ===== */
    @keyframes overlay-fade { from { opacity: 0; } }
    @keyframes overlay-pop {
      from { opacity: 0; transform: translateY(12px) scale(0.97); }
    }
    .overlay-fade { animation: overlay-fade 0.16s ease both; }
    .overlay-pop { animation: overlay-pop 0.24s cubic-bezier(0.16, 1, 0.3, 1) both; }

    /* ===== 拖拽调整尺寸时禁止 iframe 吞掉指针事件 ===== */
    .shell-dragging iframe { pointer-events: none; }
    .shell-dragging { user-select: none; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "solid-js": "https://unpkg.com/solid-js@1.9.3/dist/solid.js",
      "solid-js/web": "https://unpkg.com/solid-js@1.9.3/web/dist/web.js",
      "solid-js/html": "https://unpkg.com/solid-js@1.9.3/html/dist/html.js",
      "comlink": "https://unpkg.com/comlink@4.4.1/dist/esm/comlink.mjs"
    }
  }
  </script>
</head>
<body>
  <div id="app" class="h-full"></div>

  <script type="module">
    import { render } from 'solid-js/web';
    import html from 'solid-js/html';
    import { createSharedStore } from '/lib/shared-state-core.js';
    import { AppShell } from '/lib/components/AppShell.js';
    import { getJSON, sendJSON } from '/lib/api.js';

    // ====== bootstrap：从后端 hydrate 共享状态 ======
    let initial = {};
    try { initial = await getJSON('/api/workspace/ui'); } catch (e) { console.warn('workspace load failed', e); }

    const store = createSharedStore({
      currentFile: null,
      theme: 'dark',
      sidebarWidth: 272,
      sidebarOpen: true,
      activeSideView: 'files',
      terminalOpen: true,
      panelHeight: 260,
      scmVersion: 0,
      ...initial,
    }, async (keys, state) => {
      // scmVersion 不入盘（运行时计数）
      const persistKeys = keys.filter(k => k !== 'scmVersion');
      if (!persistKeys.length) return;
      const patch = Object.fromEntries(persistKeys.map(k => [k, state[k]]));
      try { await sendJSON('/api/workspace/ui', 'PATCH', patch); }
      catch (e) { console.error('[parent] persist failed:', e); }
    });

    // ====== 子 iframe postMessage 桥 ======
    // （主题广播走 postMessage 比 Comlink 订阅更可靠；快捷键由 iframe 捕获转发）
    window.addEventListener('message', (e) => {
      const d = e.data;
      if (!d?.type) return;
      if (d.type === 'peri:closeGraph') {
        store.closeGraph?.();
      } else if (d.type === 'peri:closeGetman') {
        store.closeGetman?.();
      } else if (d.type === 'peri:getTheme') {
        const current = store.get('theme') || 'dark';
        e.source?.postMessage({ type: 'peri:setTheme', theme: current }, '*');
      } else if (d.type === 'peri:setTheme' && d.theme) {
        if (d.theme !== store.get('theme')) store.set('theme', d.theme);
      } else if (d.type === 'peri:key') {
        // 子 iframe 转发的快捷键
        if (d.action === 'toggle-terminal') store.toggleTerminal?.();
        else if (d.action === 'toggle-sidebar') store.toggleSidebar?.();
        else if (d.action === 'escape') store.closeOverlays?.();
      }
    });

    // ====== 同步 theme 到 documentElement + 广播到所有子 iframe ======
    store.subscribe('theme', (t) => {
      if (t) {
        document.documentElement.dataset.theme = t;
        document.querySelectorAll('iframe').forEach(iframe => {
          iframe.contentWindow?.postMessage({ type: 'peri:setTheme', theme: t }, '*');
        });
      }
    });
    // 初始化一次（subscribe 不会立即触发）
    if (store.get('theme')) document.documentElement.dataset.theme = store.get('theme');

    // ====== App Shell ======
    render(() => html`<${AppShell} store=${store} />`, document.getElementById('app'));
  </script>
</body>
</html>
