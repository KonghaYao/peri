name: Release Agent

on:
    push:
        tags:
            - "agent-v*"

env:
    CARGO_TERM_COLOR: always

jobs:
    build:
        name: Build (${{ matrix.target }})
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: ubuntu-latest
                      target: x86_64-unknown-linux-gnu
                      platform: linux-x86_64
                      ext: ""
                    - os: ubuntu-latest
                      target: aarch64-unknown-linux-gnu
                      platform: linux-aarch64
                      ext: ""
                    - os: macos-latest
                      target: x86_64-apple-darwin
                      platform: macos-x86_64
                      ext: ""
                    - os: macos-latest
                      target: aarch64-apple-darwin
                      platform: macos-aarch64
                      ext: ""
                    - os: ubuntu-latest
                      target: riscv64gc-unknown-linux-gnu
                      platform: linux-riscv64
                      ext: ""
                    - os: windows-latest
                      target: x86_64-pc-windows-msvc
                      platform: windows-x86_64
                      ext: ".exe"

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: ${{ matrix.target }}

            - name: Set version from tag
              shell: bash
              run: |
                  VERSION="${GITHUB_REF_NAME#agent-v}"
                  echo "Setting version to ${VERSION}"
                  sed -i.bak -e "s/^version = \".*\"/version = \"${VERSION}\"/" Cargo.toml
                  rm -f Cargo.toml.bak
                  # sed 只改 Cargo.toml；--locked 构建要求 Cargo.lock 中的 workspace 成员
                  # 版本与之一致，故按同一 patch 配置同步一次 lock。
                  ./scripts/cargo-rmcp-patched.sh update --workspace

            - name: Cache cargo registry
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/registry/index
                      ~/.cargo/registry/cache
                      ~/.cargo/git/db
                  key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
                  restore-keys: ${{ runner.os }}-cargo-

            - name: Cache build artifacts
              uses: actions/cache@v4
              with:
                  path: target
                  key: ${{ runner.os }}-${{ matrix.target }}-build-${{ hashFiles('**/Cargo.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-${{ matrix.target }}-build-
                      ${{ runner.os }}-${{ matrix.target }}-

            - name: Install cross
              if: runner.os == 'Linux'
              run: cargo install cross

            - name: Build agent-tui (Linux)
              if: runner.os == 'Linux'
              shell: bash
              run: |
                  # cross 在构建前会先运行一次不带 --config 的 `cargo metadata`；
                  # 若该调用看不到 patch 配置，会按 crates.io 版本改写 Cargo.lock，
                  # 随后 `--locked` 构建直接失败。把同一份 patch 配置放进 cargo
                  # 用户级配置链（容器内随 $CARGO_HOME 挂载继承），让 cross 内部
                  # 调用与容器内 cargo 都读到同一 patch。
                  ./scripts/cargo-rmcp-patched.sh --version > /dev/null
                  cargo_home="${CARGO_HOME:-$HOME/.cargo}"
                  mkdir -p "$cargo_home"
                  cp "$(ls -t target/peri-rmcp-patches/*/cargo-config.toml | head -1)" "$cargo_home/config.toml"
                  ./scripts/cargo-rmcp-patched.sh --cross build --locked -p peri-tui --release --target ${{ matrix.target }}

            - name: Build agent-tui (non-Linux)
              if: runner.os != 'Linux'
              shell: bash
              run: ./scripts/cargo-rmcp-patched.sh build --locked -p peri-tui --release --target ${{ matrix.target }}

            # 归档根目录内的可执行文件必须叫 peri / peri.exe：mise 等安装器按归档内
            # 文件名暴露命令名，不剥离平台后缀。逐资产校验和按 <asset>.sha256 命名发布。
            # 归档同时携带随包 workflow sidecar（`peri-resources/workflow/<内容身份>/`）：
            # Rust 侧不嵌入 JS 产物，按该布局消费（peri-workflow/src/runner/artifact.rs）。
            - name: Package binaries (Unix)
              if: matrix.ext == ''
              run: |
                  mkdir -p dist/package
                  cp "target/${{ matrix.target }}/release/peri" dist/package/peri
                  chmod +x dist/package/peri
                  sidecar_id="$(sha256sum npm-packages/@peri-workflow/dist/peri-workflow.js | cut -d' ' -f1)"
                  sidecar_id="${sidecar_id:0:12}"
                  sidecar_dir="dist/package/peri-resources/workflow/${sidecar_id}"
                  mkdir -p "${sidecar_dir}/dist"
                  cp npm-packages/@peri-workflow/dist/peri-workflow.js "${sidecar_dir}/dist/peri-workflow.js"
                  cp npm-packages/@peri-workflow/package.json "${sidecar_dir}/package.json"
                  tar -czf "dist/peri-${{ matrix.platform }}.tar.gz" -C dist/package peri peri-resources
                  rm -rf dist/package
                  cd dist
                  if command -v sha256sum >/dev/null 2>&1; then
                      sha256sum "peri-${{ matrix.platform }}.tar.gz" > "peri-${{ matrix.platform }}.tar.gz.sha256"
                  else
                      shasum -a 256 "peri-${{ matrix.platform }}.tar.gz" > "peri-${{ matrix.platform }}.tar.gz.sha256"
                  fi

            - name: Package binaries (Windows)
              if: matrix.ext == '.exe'
              shell: pwsh
              run: |
                  New-Item -ItemType Directory -Force -Path dist/package | Out-Null
                  Copy-Item "target/${{ matrix.target }}/release/peri.exe" "dist/package/peri.exe"
                  $sidecarId = (Get-FileHash -Algorithm SHA256 "npm-packages/@peri-workflow/dist/peri-workflow.js").Hash.ToLower().Substring(0, 12)
                  $sidecarDir = "dist/package/peri-resources/workflow/$sidecarId"
                  New-Item -ItemType Directory -Force -Path "$sidecarDir/dist" | Out-Null
                  Copy-Item "npm-packages/@peri-workflow/dist/peri-workflow.js" "$sidecarDir/dist/peri-workflow.js"
                  Copy-Item "npm-packages/@peri-workflow/package.json" "$sidecarDir/package.json"
                  Compress-Archive -Path "dist/package/*" -DestinationPath "dist/peri-${{ matrix.platform }}.zip"
                  Remove-Item -Recurse -Force dist/package
                  Set-Location dist
                  $asset = "peri-${{ matrix.platform }}.zip"
                  $hash = (Get-FileHash -Algorithm SHA256 $asset).Hash.ToLower()
                  # 显式写 LF：发布 job 用 GNU sha256sum --check 校验，CRLF 会解析失败
                  [System.IO.File]::WriteAllText("$PWD/$asset.sha256", "$hash  $asset`n")

            - name: Upload artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: binaries-${{ matrix.platform }}
                  path: dist/
                  retention-days: 7

    release:
        name: Create GitHub Release
        needs: build
        runs-on: ubuntu-latest
        permissions:
            contents: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Download all artifacts
              uses: actions/download-artifact@v4
              with:
                  path: artifacts/
                  merge-multiple: true

            - name: List artifacts
              run: ls -lR artifacts/

            # 发布前核对归档布局、逐资产校验和与 sidecar 内容身份；任一项回归都在此失败，
            # 不进入 Release。四者一致（归档元数据 / 归档内 JS 完整 sha256 / 目录身份 /
            # Rust 侧 pin）由 scripts/verify-workflow-sidecar.sh 单点校验。
            - name: Verify packages
              run: |
                  cd artifacts
                  sha256sum --check peri-*.sha256
                  for archive in peri-*.tar.gz; do
                      bash ../scripts/verify-workflow-sidecar.sh "$archive" peri
                  done
                  for archive in peri-*.zip; do
                      bash ../scripts/verify-workflow-sidecar.sh "$archive" peri.exe
                  done

            - name: Generate checksums
              run: |
                  cd artifacts
                  sha256sum peri-*.tar.gz peri-*.zip > checksums.txt
                  cat checksums.txt

            - name: Create Release
              uses: softprops/action-gh-release@v2
              with:
                  files: |
                      artifacts/*
                  generate_release_notes: true
                  draft: false
                  prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
