<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="/css/base.css">
  <script src="https://unpkg.com/marked@15.0.9/marked.min.js"></script>
  <link rel="stylesheet" href="/css/theme.css">
  <style type="text/tailwindcss">
    .markdown-body { line-height: 1.6; }
    .markdown-body h1, .markdown-body h2, .markdown-body h3 { margin: 16px 0 8px; }
    .markdown-body pre { background: var(--color-bg-secondary); padding: 12px; border-radius: 4px; overflow: auto; }
    .code-body { white-space: pre; font-family: 'SF Mono', Consolas, monospace; font-size: 13px; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "solid-js": "https://unpkg.com/solid-js@1.9.3/dist/solid.js",
      "solid-js/web": "https://unpkg.com/solid-js@1.9.3/web/dist/web.js",
      "solid-js/html": "https://unpkg.com/solid-js@1.9.3/html/dist/html.js",
      "comlink": "https://unpkg.com/comlink@4.4.1/dist/esm/comlink.mjs"
    }
  }
  </script>
</head>
<body class="overflow-auto text-[14px]">
  <div id="app" class="p-4"></div>

  <script type="module">
    import { render } from 'solid-js/web';
    import html from 'solid-js/html';
    import { Preview } from '/lib/preview/Preview.js';

    render(() => html`<${Preview} />`, document.getElementById('app'));
  </script>
</body>
</html>
