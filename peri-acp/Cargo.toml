[package]
name = "peri-acp"
version.workspace = true
edition.workspace = true
description = "ACP Agent service layer — Session management, Agent construction, Middleware chain, Transport abstraction"

[lib]
name = "peri_acp"
path = "src/lib.rs"

[dependencies]
peri-acp-types = { path = "../peri-acp-types" }
# L5（l5-shell）收口后依赖声明（host/exec/ 已拆桥删除，执行本体在
# peri-agent::session::exec）：
# - peri-agent：薄壳调用面——`session/executor.rs` 协议化入口 re-export
#   （run_session_loop / SessionContext / TurnInput 等）+ host 装配面闭包签名
#   （StageBuildFn / ForwarderLauncherFn / CachedLlmInstances / TaskManager），
#   保留。
# - peri-middlewares：宿主装配面引用（host/workflow_agent.rs 中间件链 /
#   host/stage_builder.rs 装配实现 ProductionChainAssembler / host/prompt.rs +
#   prompt_exec.rs 注入闭包构造 parent_tools / chain_assembler /
#   tool_invocation_resolver / session/mod.rs build_frozen_data 渲染面），
#   保留（workflow_agent 执行体留 ACP 的裁定见 host/workflow_agent.rs；
#   WorkflowMiddlewareFactoryPort 注入为彻底收口方案，另立收紧任务）。
# - peri-workflow：host/workflow_agent.rs 的 AgentExecutor trait / protocol
#   引用（同上，随 workflow_agent 归位裁定保留）。
# - peri-model：宿主装配面类型签名（host/workflow_agent.rs / host/stage_builder.rs
#   的 Arc<dyn peri_model::Model>）与 ACP 既有引用（provider/mod.rs LLM 工厂 /
#   session/agent_pool.rs 模型缓存 / event/mapper.rs StopReason 协议映射 /
#   dispatch/* 执行上下文签名），保留。
# - check-layer-imports.sh 为验收门：非测试、非豁免路径代码禁止引用
#   peri-middlewares / peri-lsp / peri-workflow（豁免见 scripts/import-exemptions.conf，
#   host/workflow_agent.rs + host/stage_builder.rs 为 L5 装配面宿主）。
peri-agent = { path = "../peri-agent" }
peri-controller = { path = "../peri-controller" }
peri-model = { path = "../peri-model" }
peri-middlewares = { path = "../peri-middlewares" }
peri-workflow = { path = "../peri-workflow" }
agent-client-protocol = { version = "1.2", features = ["unstable"] }
agent-client-protocol-schema = { version = "1.4", features = ["unstable_elicitation"] }
tokio.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
parking_lot.workspace = true
tracing.workspace = true
anyhow.workspace = true
thiserror.workspace = true
uuid.workspace = true
chrono.workspace = true
dashmap = "6"
tokio-util.workspace = true
dirs-next.workspace = true
url.workspace = true

[dev-dependencies]
tempfile.workspace = true
serial_test.workspace = true
mockito = "1"
langfuse-client = { path = "../langfuse-client" }
