[package]
name = "peri-mcp-common"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Shared behavior for Peri builtin MCP instances"
license = "Apache-2.0"

[dependencies]
peri-mcp-core.workspace = true
peri-time = { path = "../../peri-time" }
peri-agent = { path = "../../peri-agent" }
peri-acp-types = { path = "../../peri-acp-types" }
peri-process = { path = "../../peri-process" }
anyhow.workspace = true
axum.workspace = true
chrono.workspace = true
fs4 = { version = "1.1.0", features = ["sync"] }
futures.workspace = true
libc = "0.2"
rmcp = { workspace = true, features = ["transport-streamable-http-server"] }
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile.workspace = true
# 测试面需要 `MessageQueue::*_async`（drain 夹具）；生产构建不含这些方法。
peri-acp-types = { path = "../../peri-acp-types", features = ["test-support"] }

[target.'cfg(not(target_os = "emscripten"))'.dependencies]
tokio = { workspace = true, features = ["full"] }
