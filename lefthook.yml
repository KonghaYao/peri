# lefthook.yml - Git hooks managed by lefthook
# Install: lefthook install
# Run manually: lefthook run pre-commit

pre-commit:
  parallel: false
  commands:
    fmt:
      glob: "*.rs"
      run: cargo fmt --check
      fix: cargo fmt

    check:
      glob: "*.rs"
      run: ./scripts/cargo-rmcp-patched.sh check --locked

    # 本地 Clippy：暂存 crate 变更按直接归属检查，共享构建输入改动时检查整个 workspace。
    # 不使用 *.rs glob：Cargo 配置、锁文件和工具链同样能改变 lint 结果。
    # 全量本地验证可另跑 scripts/verify-async.sh；普通 CI 不运行 Clippy。
    clippy:
      run: |
        changed_crates="$(bash scripts/changed-crate-args.sh --staged-only --direct-only)" || exit $?
        if [ -z "$changed_crates" ]; then
          echo "[clippy] 暂存改动未命中任何 workspace crate 或共享构建输入，跳过"
          exit 0
        fi
        case "$(uname -s)" in
          MINGW*|MSYS*|CYGWIN*)
            ./scripts/cargo-rmcp-patched.sh clippy --locked $changed_crates --lib --bins -- -D warnings
            ;;
          *)
            ./scripts/cargo-rmcp-patched.sh clippy --locked $changed_crates --all-targets -- -D warnings
            ;;
        esac

    # §0 依赖方向 CI 门（Seam 3 完整版，PRD 决策 2）：八条边（TUI / ACP 业务面 /
    # ACP→model / Controller / Runtime / Resources / Middlewares / Agent）×
    # use 导入 + 全路径引用双模式全校验；豁免清单唯一事实源 =
    # scripts/import-exemptions.conf（每条豁免标注归属收紧任务）。
    # 取代 check-resources-imports.sh / check-acp-imports.sh / check-tui-imports.sh。
    # 无 glob——无论改哪个文件都校验（依赖方向与单文件改动无必然关联）。
    layer-imports:
      run: bash scripts/check-layer-imports.sh

    tui-components:
      run: |
        python3 scripts/test-tui-components.py && python3 scripts/check-tui-components.py

    feature-catalog:
      run: |
        python3 scripts/test-feature-catalog.py && python3 scripts/check-feature-catalog.py

    # doc-tests 不在 pre-commit 中运行——cargo check/clippy 不编译 doc test，
    # 显式验证用: ./scripts/cargo-rmcp-patched.sh test --locked --workspace --doc

    # security-audit:
    #   run: cargo audit
    #   未安装则运行: cargo install cargo-audit && cargo audit
