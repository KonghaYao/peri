[workspace]
members = [
    "peri-config",
    "peri-acp",
    "peri-acp-types",
    "peri-agent",
    "peri-controller",
    "peri-middlewares",
    "mcp-packages/common",
    "peri-mcp-core",
    "mcp-packages/config",
    "mcp-packages/credentials",
    "mcp-packages/web",
    "mcp-packages/artifact",
    "mcp-packages/cron",
    "mcp-packages/lsp",
    "mcp-packages/workspace",
    "peri-model",
    "peri-process",
    "peri-resources",
    "peri-time",
    "peri-runtime",
    "peri-tui",
    "langfuse-client",
    "peri-js-runtime",
    "peri-workflow",
    "peri-wasm",
]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"

[profile.release]
# NOTE: "symbols" not "true" — Apple strip doesn't behave like GNU strip.
#       "true" on macOS only strips debug info, leaving 8MB of symbol table.
strip = "symbols"
opt-level = "z"
lto = true
codegen-units = 1

# ============================================================================
# Workspace-wide dependency declarations
# Single source of truth — all crates reference via `workspace = true`.
# ============================================================================

[workspace.dependencies]
peri-config = { path = "peri-config" }
peri-time = { path = "peri-time" }
# --- Async runtime ---
# Shared runtime baseline; native crates opt into full features at their target boundary.
tokio = { version = "1", default-features = false, features = ["rt", "macros", "sync", "time", "io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures = "0.3"
async-trait = "0.1"

# --- Serde ecosystem ---
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
serde_yaml = "0.9"

# --- HTTP ---
reqwest = { version = "=0.13.4", default-features = false, features = [
    "json",
    "rustls",
] }

# --- Time ---
chrono = { version = "0.4", features = ["serde"] }

# --- Error handling ---
anyhow = "1.0"
thiserror = "2.0"

# --- Logging ---
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [
    "env-filter",
    "fmt",
    "json",
] }
tracing-appender = "0.2"

# --- Utilities ---
uuid = { version = "1", features = ["v4", "v7", "serde"] }
# send_guard feature 已移除（批 4 依赖清理）：批 2 为 stdio typed handler 层
# 的 `await_holding_lock` 规避引入，批 3 删除 adapter 后无任何代码使用
# `MappedSendGuard`/`send_guard`（grep 全 workspace 无引用）；无跨 await 持锁
# 告警（clippy -D warnings 验证）。
parking_lot = "0.12"
dirs-next = "2"
url = "2"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite"] }
sysinfo = "0.39"
lsp-types = "0.97"
lru = "0.18"

# --- MCP capability packages ---
peri-mcp-common = { path = "mcp-packages/common" }
peri-mcp-core = { path = "peri-mcp-core" }
peri-mcp-config = { path = "mcp-packages/config" }
peri-mcp-credentials = { path = "mcp-packages/credentials" }
peri-mcp-web = { path = "mcp-packages/web" }
peri-mcp-artifact = { path = "mcp-packages/artifact" }
peri-mcp-cron = { path = "mcp-packages/cron" }
peri-mcp-lsp = { path = "mcp-packages/lsp" }
peri-mcp-workspace = { path = "mcp-packages/workspace" }
# Apply patches/rmcp-3.5.0-task-subscriptions.patch via scripts/cargo-rmcp-patched.sh.
rmcp = "3.5.0"

# --- Build ---
tempfile = "3"

# --- Allocator ---
tikv-jemallocator = "0.6"
tikv-jemalloc-ctl = { version = "0.6", features = ["stats", "use_std"] }
tikv-jemalloc-sys = "0.6"

clap = { version = "4", features = ["derive", "env"] }
semver = "1"
sha2 = "0.10"

axum = { version = "0.8.9", features = ["ws"] }
serial_test = { version = "4.0.1", features = ["async"] }
