# Fixture: 正常的 CI 执行范围（一次主调用 + 四个逐 binary 门禁），
# 用于 ci_test_inventory 的正向与 CLI 测试。
jobs:
    build:
        steps:
            - name: Run workspace tests (all targets except Compact adversarial suites)
              shell: bash
              run: >-
                  cargo nextest run --locked --workspace --profile ci --no-tests=fail
                  -E 'not (package(=peri-agent) & binary(=compact_pressure_adversarial_test)
                  | package(=peri-agent) & binary(=compact_session_adversarial_test)
                  | package(=peri-agent) & binary(=compact_session_manual_adversarial_test)
                  | package(=peri-agent) & binary(=compact_authority_projection_test))'

            - name: Run Compact pressure suite
              shell: bash
              run: >-
                  cargo nextest run --locked --workspace --profile ci --no-tests=fail
                  -E 'package(=peri-agent) & binary(=compact_pressure_adversarial_test)'

            - name: Run Compact session suite
              shell: bash
              run: >-
                  cargo nextest run --locked --workspace --profile ci --no-tests=fail
                  -E 'package(=peri-agent) & binary(=compact_session_adversarial_test)'

            - name: Run Compact session manual suite
              shell: bash
              run: >-
                  cargo nextest run --locked --workspace --profile ci --no-tests=fail
                  -E 'package(=peri-agent) & binary(=compact_session_manual_adversarial_test)'

            - name: Run Compact authority suite
              shell: bash
              run: >-
                  cargo nextest run --locked --workspace --profile ci --no-tests=fail
                  -E 'package(=peri-agent) & binary(=compact_authority_projection_test)'

            - name: Run doctests
              shell: bash
              run: >-
                  cargo test --doc --locked --workspace
                  --exclude peri-acp --exclude peri-tui
