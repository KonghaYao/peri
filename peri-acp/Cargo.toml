[package]
name = "peri-acp"
version.workspace = true
edition.workspace = true
description = "ACP Agent service layer — Session management, Agent construction, Middleware chain, Transport abstraction"

[lib]
name = "peri_acp"
path = "src/lib.rs"

[dependencies]
peri-acp-types = { path = "../peri-acp-types" }
# 依赖方向注释（p1-deps-acp 收敛后状态）：
# - peri-agent：薄壳调用面——`session/executor.rs` 协议化入口 re-export
#   （run_session_loop / SessionContext / TurnInput 等）+ host 装配面闭包签名
#   （StageBuildFn / ForwarderLauncherFn / CachedLlmInstances / TaskManager）
#   + workflow agent 执行体与装配端口（`agent::workflow`，p1-wa 迁入），保留。
# - peri-middlewares：L5 宿主装配面引用（host/prompt.rs + prompt_exec.rs 注入
#   闭包构造 parent_tools / chain_assembler / tool_invocation_resolver /
#   session/mod.rs build_frozen_data 渲染面）+ ACP Host 部署装配点
#   （host/assemble.rs + host/stdio/init.rs 内部构造 CronScheduler /
#   McpClientPool / ToolSearchIndex / workflow 中间件工厂，M-TUI 装配迁移
#   落点），保留（L5 复核时再收）。
# - peri-workflow：生产引用已清零（p1-wa：执行体迁入 peri-agent，协议类型走
#   peri-acp-types::workflow 同源 re-export），仅 dev-dependencies 保留
#   （requests_test.rs 构造 WorkflowRun/AgentExecutor 测试面）。
# - peri-model：裁定保留——(a) 装配面透传签名（host/stage_builder.rs
#   auxiliary_model 为 StageBuildFn 契约镜像，经 peri-acp-types::model
#   re-export 引用）；(b) ACP 既有功能：provider/mod.rs LLM 工厂与协议配置、
#   dispatch/* + session/agent_pool.rs 执行上下文签名、event/mapper.rs
#   StopReason 协议映射（随 v1 退役收敛）。
# - check-layer-imports.sh 为验收门：非测试、非豁免路径代码禁止引用
#   peri-middlewares / peri-lsp / peri-workflow（豁免见 scripts/import-exemptions.conf）。
peri-agent = { path = "../peri-agent" }
peri-controller = { path = "../peri-controller" }
peri-model = { path = "../peri-model" }
peri-middlewares = { path = "../peri-middlewares" }
agent-client-protocol = { version = "2", features = ["unstable"] }
agent-client-protocol-schema = { version = "=1.5.0", features = ["unstable_elicitation"] }
tokio.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
parking_lot.workspace = true
tracing.workspace = true
anyhow.workspace = true
thiserror.workspace = true
uuid.workspace = true
chrono.workspace = true
dashmap = "6"
tokio-util.workspace = true
dirs-next.workspace = true
url.workspace = true

[dev-dependencies]
tempfile.workspace = true
serial_test.workspace = true
mockito = "1"
langfuse-client = { path = "../langfuse-client" }
# 测试面（requests_test.rs 构造真实 WorkflowMiddleware：WorkflowRun /
# AgentExecutor 等 registry/runner 类型仅测试构造使用，不构成协议/业务面依赖）
peri-workflow = { path = "../peri-workflow" }
