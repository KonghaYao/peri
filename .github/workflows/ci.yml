name: CI

on:
    push:
        branches: [main, pre-release/main]
    pull_request:
        branches: [main, pre-release/main]

# 同一 PR 只保留最新运行；各分支的每次 push 仍独立验证。
concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
    CARGO_TERM_COLOR: always
    # 仅关闭 CI 调试信息，减少编译、链接与缓存开销；保留断言和溢出检查。
    CARGO_PROFILE_DEV_DEBUG: "0"
    CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
    build:
        name: Build (${{ matrix.os }})
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                include: >-
                    ${{ fromJSON('[{"os":"ubuntu-latest","target":"x86_64-unknown-linux-gnu"},{"os":"macos-latest","target":"aarch64-apple-darwin"},{"os":"windows-latest","target":"x86_64-pc-windows-msvc"}]') }}

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            # 平台无关的源码检查只在 Linux 执行，并在工具链和缓存恢复前快速失败。
            # §0 依赖方向 CI 门（Seam 3 完整版，PRD 决策 2）：八条边（TUI / ACP
            # 业务面 / ACP→model / Controller / Runtime / Resources / Middlewares /
            # Agent）× use 导入 + 全路径引用双模式全校验；豁免清单唯一事实源 =
            # scripts/import-exemptions.conf。
            - name: Check §0 layer imports
              if: runner.os == 'Linux'
              run: bash scripts/check-layer-imports.sh

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@master
              with:
                  toolchain: stable
                  targets: ${{ matrix.target }}
                  components: clippy

            - name: Cache cargo registry and build
              uses: Swatinem/rust-cache@v2
              with:
                  key: ${{ matrix.target }}

            - name: Build
              shell: bash
              run: ./scripts/cargo-rmcp-patched.sh build --locked --workspace --all-targets

            # 分步记录耗时，也确保 Windows 下第一组失败不会被后续成功覆盖。
            - name: Run workspace tests (excluding ACP, middleware and MCP capabilities)
              shell: bash
              run: >-
                  ./scripts/cargo-rmcp-patched.sh test --locked --workspace --exclude peri-acp --exclude peri-agent --exclude peri-tui --exclude peri-middlewares
                  --exclude peri-mcp-common --exclude peri-mcp-web --exclude peri-mcp-artifact
                  --exclude peri-mcp-cron --exclude peri-mcp-workspace

            - name: Run ACP tests (excluding SDK E2E)
              shell: bash
              run: >-
                  ./scripts/cargo-rmcp-patched.sh test --locked -p peri-acp --lib
                  -- --skip host::execution_admission_jsonl --skip host::scheduled_admission

            - name: Run Agent tests (excluding execution E2E)
              shell: bash
              run: |
                  ./scripts/cargo-rmcp-patched.sh test --locked -p peri-agent --lib
                  ./scripts/cargo-rmcp-patched.sh test --locked -p peri-agent --test middleware_tests --test compact_followup_behavior_test --test compact_failure_adversarial_test

            # ARC-COMPACT-001 Verify：Compact 三套对抗套件必须真实执行且命中非零用例。
            # `test-fixtures` 提供 best-effort 循环装配（无 durable 执行）——这些套件用脚本
            # `ReactLLM` 替身考察预算/投影，不实现 durable Reason 所需的 `prepare_reasoning`。
            - name: Run Compact adversarial suites (ARC-COMPACT-001)
              shell: bash
              run: >-
                  ./scripts/cargo-rmcp-patched.sh test --locked -p peri-agent --features test-fixtures
                  --test compact_pressure_adversarial_test --test compact_session_adversarial_test
                  --test compact_authority_projection_test

            - name: Run TUI tests (excluding SDK E2E)
              shell: bash
              run: >-
                  ./scripts/cargo-rmcp-patched.sh test --locked -p peri-tui --lib --bins --test meta_session_cli
                  -- --skip sdk_execution::tests::real_sdk

            # 涉及进程级全局状态的测试仍须串行执行。
            - name: Run middleware unit tests (serial, excluding E2E)
              shell: bash
              run: >-
                  ./scripts/cargo-rmcp-patched.sh test --locked -p peri-middlewares --lib
                  -- --test-threads=1 --skip subagent::tool --skip mcp::workspace_recovery_tests
                  --skip mcp::workspace_builtin_tests::bridge_accepts_workspace_owned_task_handle
                  --skip mcp::tool_bridge::tests::builtin_tool_call_surfaces_timeout_error_after_bridge_deadline

            - name: Run MCP capability tests (serial)
              shell: bash
              run: >-
                  ./scripts/cargo-rmcp-patched.sh test --locked -p peri-mcp-common -p peri-mcp-web
                  -p peri-mcp-artifact -p peri-mcp-cron -p peri-mcp-workspace -- --test-threads=1

            - name: Clippy
              shell: bash
              run: |
                  if [[ "$RUNNER_OS" == "Windows" ]]; then
                      ./scripts/cargo-rmcp-patched.sh clippy --locked --workspace --lib --bins -- -D warnings
                  else
                      ./scripts/cargo-rmcp-patched.sh clippy --locked --workspace --all-targets -- -D warnings
                  fi
