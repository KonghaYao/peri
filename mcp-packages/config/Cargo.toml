[package]
name = "peri-mcp-config"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Configuration data plane and bootstrap MCP client"
license = "Apache-2.0"

[dependencies]
peri-time = { path = "../../peri-time" }
peri-acp-types = { path = "../../peri-acp-types" }
dirs.workspace = true
fs4 = { version = "1.1.0", features = ["sync"] }
rmcp = { workspace = true, features = ["client"] }
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(not(target_os = "emscripten"))'.dependencies]
tokio = { workspace = true, features = ["full"] }
