[package]
name = "peri-mcp-workspace"
version.workspace = true
edition.workspace = true
description = "Workspace filesystem and terminal builtin MCP instance"
license = "Apache-2.0"

[dependencies]
anyhow.workspace = true
axum.workspace = true
clap = { version = "4", features = ["derive"] }
dirs-next.workspace = true
peri-agent = { path = "../../peri-agent" }
peri-acp-types = { path = "../../peri-acp-types" }
peri-mcp-common = { path = "../common" }
async-trait.workspace = true
base64 = { version = "0.22", features = ["alloc"] }
chrono.workspace = true
fuzzy-matcher = "0.3"
grep = "0.4"
glob = "0.3"
ignore = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
parking_lot.workspace = true
rmcp = { workspace = true, features = ["transport-streamable-http-server"] }
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["process"] }
tokio-util.workspace = true
tracing.workspace = true
uuid.workspace = true
walkdir = "2.5"

[dev-dependencies]
filetime = "0.2"
futures.workspace = true
regex = "1"
rmcp = { workspace = true, features = ["client", "transport-streamable-http-client-reqwest"] }
reqwest.workspace = true
serial_test.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tokio-util.workspace = true
