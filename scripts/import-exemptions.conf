# Perihelion §0 全边依赖门（Seam 3 完整版）— 豁免清单唯一事实源
#
# 由 scripts/check-layer-imports.sh 读取。每条规则一行，字段以 @ 分隔
# （@ 不出现在正则/路径/标签中；bash IFS 不支持多字符定界符）：
#   <被检目录> @ <grep -E 正则> @ <豁免路径（空格分隔，路径子串匹配）> @ <标签>
#
# 约定：
# - 每边两条规则：use 行查 import 语句（正则 `use peri_xxx\b`），全路径行查
#   代码内全路径引用（正则 `peri_xxx::`；use 语句行由脚本排除，两模式不重叠，
#   各自独立配置豁免——防僵尸豁免）
# - 正则 `\b` 词边界防 crate 名前缀误伤（`peri_acp` 不匹配 `peri_acp_types`）
# - 豁免路径为路径子串（如 main.rs、host/exec/、acp_client/）；豁免必须对该
#   模式实际命中（验收时逐一移除交叉验证，防僵尸清单）
# - 测试文件全局豁免（*_test.rs / *_test/ / tests/）：测试经引用业务 crate 仅
#   验证行为，不构成协议/业务面依赖
# - 行首 # 为注释；label 内不得含 @ 与换行
