name: Build Next Major

on:
    push:
        branches: [pre-release/main]
    workflow_dispatch:
        inputs:
            # 仅用于验证「sidecar 前置失败 → build 矩阵 skipped」：build/wasm 仍受
            # pre-release/main 的 ref 守卫约束，dispatch 到其它分支不会触发发布。
            fault:
                description: sidecar 故障注入（仅验证短路行为）
                type: choice
                options: [none, build-failure, missing-entry, identity-mismatch]
                default: none

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false

env:
    CARGO_TERM_COLOR: always

jobs:
    # sidecar 生成前置（与 release-agent 共用同一份实现）。失败即 build 矩阵整体
    # 不启动，预发布的 beta 资产不会带着缺失/漂移的 JS 进入打包阶段。
    sidecar:
        uses: ./.github/workflows/workflow-sidecar.yml
        with:
            fault: ${{ inputs.fault || 'none' }}

    build:
        name: Build (${{ matrix.target }})
        if: github.ref == 'refs/heads/pre-release/main'
        needs: sidecar
        runs-on: ${{ matrix.os }}
        timeout-minutes: 90
        defaults:
            run:
                shell: bash
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: ubuntu-latest
                      target: x86_64-unknown-linux-gnu
                      platform: linux-x86_64
                    - os: macos-latest
                      target: aarch64-apple-darwin
                      platform: macos-aarch64

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: ${{ matrix.target }}

            # 注册表缓存 key 取根 Cargo.lock（依赖集的真实输入）；`**/Cargo.lock` 会连带
            # 匹配与本构建无关的 side-projects 锁文件。
            # 作用域：本分支的缓存只有本分支（及默认分支的回落）能读；release tag 既读不到
            # 本分支缓存，也不会用本 job 的 key 格式写缓存（见 release-agent.yml）。
            - name: Cache cargo registry
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/registry/index
                      ~/.cargo/registry/cache
                      ~/.cargo/git/db
                  key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
                  restore-keys: ${{ runner.os }}-cargo-

            # 产物缓存的 key 必须含工具链身份：只按 lock 哈希取 key 时，Rust 工具链升级后
            # 旧 key 仍会精确命中，于是每次运行都是「恢复过期产物 + 全量重编」，而
            # actions/cache 在精确命中时不回写，这条陈旧缓存永远不会被刷新；把 rustc 解析
            # 出的版本纳入 key 后，工具链一变就是一次干净的未命中。
            # profile 维度：本 key（`-build-`）只承载 release profile 产物，与 ci.yml 的
            # rust-cache（v0-rust-* 前缀、dev/test profile）在 key 与 ref 作用域上都不重叠。
            - name: Resolve toolchain identity
              id: toolchain
              shell: bash
              run: echo "hash=$(rustc -vV | shasum -a 256 | cut -c1-16)" >> "$GITHUB_OUTPUT"

            - name: Cache build artifacts
              uses: actions/cache@v4
              with:
                  path: target
                  key: ${{ runner.os }}-${{ matrix.target }}-build-${{ hashFiles('Cargo.lock') }}-${{ steps.toolchain.outputs.hash }}
                  restore-keys: |
                      ${{ runner.os }}-${{ matrix.target }}-build-${{ hashFiles('Cargo.lock') }}-
                      ${{ runner.os }}-${{ matrix.target }}-build-

            # 预发布专用编译参数：本轮不改，也不复用 cf-wasm-*。结论与依据：
            # - 现有 [profile.cf-wasm-size]/[profile.cf-wasm-speed] 是为 peri-wasm 的
            #   Cloudflare 目标设计的（lto="thin"、codegen-units=16），换到这里的 native
            #   预发布二进制会同时改变产物大小与运行性能，属于未测先改；
            # - 正式发布的 lto="fat"/codegen-units=1 本轮不动；
            # - 若要做对照实验：先记录改动前后 pre-release 运行的编译时间与
            #   dist/peri-beta-*.tar.gz 体积，实验单独提交，只有落在体积与性能约束内才合入。
            - name: Build agent-tui (Linux)
              if: runner.os == 'Linux'
              run: ./scripts/cargo-rmcp-patched.sh build --locked -p peri-tui --bin peri --release --target ${{ matrix.target }}

            - name: Build agent-tui (non-Linux)
              if: runner.os != 'Linux'
              run: ./scripts/cargo-rmcp-patched.sh build --locked -p peri-tui --release --target ${{ matrix.target }}

            - name: Download workflow sidecar
              uses: actions/download-artifact@v4
              with:
                  name: workflow-sidecar
                  path: sidecar

            - name: Package binary
              env:
                  PLATFORM: ${{ matrix.platform }}
                  TARGET: ${{ matrix.target }}
                  SIDECAR_ROOT: sidecar
                  SIDECAR_IDENTITY: ${{ needs.sidecar.outputs.identity }}
              run: |
                  mkdir -p dist/package
                  cp "target/${TARGET}/release/peri" dist/package/peri-beta
                  chmod +x dist/package/peri-beta
                  # 随包 workflow sidecar：目录身份由前置任务给出（不在本矩阵内由工作树
                  # 重算），布局 `peri-resources/workflow/<内容身份>/` 与消费端对齐
                  # （peri-workflow/src/runner/artifact.rs）。
                  sidecar_entry="${SIDECAR_ROOT}/peri-resources/workflow/${SIDECAR_IDENTITY}/dist/peri-workflow.js"
                  test -f "$sidecar_entry" || { echo "missing sidecar entry: $sidecar_entry" >&2; exit 1; }
                  cp -R "${SIDECAR_ROOT}/peri-resources" dist/package/peri-resources
                  tar -czf "dist/peri-beta-${PLATFORM}.tar.gz" -C dist/package peri-beta peri-resources
                  (
                      cd dist
                      shasum -a 256 "peri-beta-${PLATFORM}.tar.gz" > "peri-beta-${PLATFORM}.tar.gz.sha256"
                  )
                  rm -rf dist/package

            - name: Upload artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: peri-beta-${{ matrix.platform }}-${{ github.sha }}
                  path: dist/
                  if-no-files-found: error
                  compression-level: 0
                  retention-days: 14

    wasm:
        name: Build (wasm32-unknown-emscripten)
        if: github.ref == 'refs/heads/pre-release/main'
        runs-on: ubuntu-24.04
        timeout-minutes: 90
        env:
            MISE_ENV: wasm
        defaults:
            run:
                shell: bash
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7
              with:
                  persist-credentials: false

            # 补丁身份必须在 mise 之前取：--print-patch-identity 只读
            # patches/emscripten/*.patch，不要求本机已有 emcc（此时 emsdk 还没装）。
            - name: Resolve Emscripten patch identity
              id: emscripten
              run: echo "identity=$(bash scripts/prepare-emscripten.sh --print-patch-identity)" >> "$GITHUB_OUTPUT"

            # 开启 mise 工具缓存（原先 cache: false 等于每次重装）：命中时省掉 emsdk/python
            # 的下载安装与 wasm-bindgen-cli 的源码编译（Build Next Major #61 实测工具安装
            # 1分46秒，其中源码安装 wasm-bindgen-cli 单项约 1分38秒）。
            # 工具来源与完整性：不引入第三方预构建产物，仍由 mise 按 mise.wasm.toml 钉死的
            # 版本安装（emsdk 6.0.10 另有 scripts/prepare-emscripten.sh 的版本断言），
            # mise 二进制自身由 action 用发布签名校验和验证后才执行。
            # 身份三要素：
            #   1. runner 镜像与架构（本 job 固定在 ubuntu-24.04）；
            #   2. mise 配置哈希 —— mise.wasm.toml 里 emsdk 6.0.10、python 3.12、
            #      wasm-bindgen-cli 0.2.129 都是钉死版本，改版本即换 key；`rust = stable`
            #      不进身份，因为 rustup 的工具链状态在 mise 数据目录之外，不会被缓存固定，
            #      stable 更新仍会被解析到（rust-cache 的 rustc 哈希随之变化）；
            #   3. Emscripten 补丁集摘要。
            # 保存时机：本 workflow 钉在 jdx/mise-action@v4，缓存的是 mise 数据目录
            # （默认 ~/.local/share/mise），该版本没有 post 步骤，`mise install` 之后立即
            # 保存，而打补丁发生在其后的步骤 —— 缓存里存的是**未打补丁**的工具链，每个新
            # runner 上仍由 scripts/prepare-emscripten.sh 重新打补丁并逐项校验。补丁摘要进
            # key 是防御：若以后升级到会延后保存的版本（缓存将包含已打补丁的工具链），
            # 旧补丁集处理过的工具链也不会被恢复，不会出现 stamp 与期望值不符导致脚本失败。
            # 写入成本：精确命中不回写，所以只在工具版本或补丁集变化时重写一次，占用仓库
            # 10GB 缓存额度的固定一部分；mise 自身的二进制也在该数据目录里，因此同样随缓存
            # 固定到 key 变化为止（mise-action 的既定行为）。
            # 回退方式：cache: false 即恢复原行为。
            - name: Install WASM build tools
              uses: jdx/mise-action@v4
              with:
                  cache: true
                  cache_key: mise-wasm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'mise.wasm.toml') }}-${{ steps.emscripten.outputs.identity }}

            # 缓存命中时 mise 直接复用数据目录里的安装记录，这里就地验证工具仍可执行：
            # 「记录在、二进制不在」这类缓存问题立刻失败，而不是等到构建/链接阶段。
            # （emsdk 由下一步的 scripts/prepare-emscripten.sh 做版本与补丁校验。）
            - name: Verify cached WASM tools
              run: mise exec -- wasm-bindgen --version

            - name: Cache Rust build
              uses: Swatinem/rust-cache@v2
              with:
                  key: next-major-wasm32-unknown-emscripten

            - name: Build peri-wasm
              run: mise exec -- ./scripts/cargo-wasm.sh build --locked --release -p peri-wasm --target wasm32-unknown-emscripten

            - name: Package WASM module
              run: |
                  output=target/wasm32-unknown-emscripten/release
                  test -s "$output/peri-wasm.js"
                  test -s "$output/peri_wasm.wasm"
                  mkdir -p dist
                  tar -czf dist/peri-beta-wasm32-unknown-emscripten.tar.gz -C "$output" peri-wasm.js peri_wasm.wasm
                  (cd dist && sha256sum peri-beta-wasm32-unknown-emscripten.tar.gz > peri-beta-wasm32-unknown-emscripten.tar.gz.sha256)

            - name: Upload WASM artifact
              uses: actions/upload-artifact@v4
              with:
                  name: peri-beta-wasm32-unknown-emscripten-${{ github.sha }}
                  path: |
                      dist/peri-beta-wasm32-unknown-emscripten.tar.gz
                      dist/peri-beta-wasm32-unknown-emscripten.tar.gz.sha256
                  if-no-files-found: error
                  compression-level: 0
                  retention-days: 14

    publish:
        name: Publish peri-beta
        needs: [build, wasm]
        runs-on: ubuntu-24.04
        permissions:
            contents: write
        defaults:
            run:
                shell: bash
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - name: Download beta artifacts
              uses: actions/download-artifact@v4
              with:
                  pattern: peri-beta-*-${{ github.sha }}
                  path: dist
                  merge-multiple: true

            - name: Verify all packages
              run: |
                  for platform in linux-x86_64 macos-aarch64; do
                      (cd dist && sha256sum --check "peri-beta-${platform}.tar.gz.sha256")
                      bash scripts/verify-workflow-sidecar.sh "dist/peri-beta-${platform}.tar.gz" peri-beta
                  done
                  (cd dist && sha256sum --check peri-beta-wasm32-unknown-emscripten.tar.gz.sha256)
                  test "$(tar -tzf dist/peri-beta-wasm32-unknown-emscripten.tar.gz)" = "$(printf 'peri-wasm.js\nperi_wasm.wasm')"

            - name: Publish rolling beta prerelease
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
              run: |
                  printf 'Development build from pre-release/main.\n\nCommit: %s\nRun: %s/actions/runs/%s\n' \
                    "$GITHUB_SHA" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > notes.md
                  if gh release view peri-beta --json isPrerelease --jq '.isPrerelease' > prerelease.txt; then
                      test "$(cat prerelease.txt)" = true
                      gh release upload peri-beta dist/* --clobber
                      gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/peri-beta" \
                        -f sha="$GITHUB_SHA" -F force=true
                      gh release edit peri-beta --title 'Peri Beta' --prerelease --latest=false --notes-file notes.md
                  else
                      gh release create peri-beta dist/* --target "$GITHUB_SHA" \
                        --title 'Peri Beta' --prerelease --latest=false --notes-file notes.md
                  fi
