[package]
name = "peri-model"
version.workspace = true
edition.workspace = true
description = "Model-neutral protocol types and stream-first model interface for Peri"
license = "Apache-2.0"

[features]
cloudflare = ["dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:js-sys"]

[[example]]
name = "cloudflare-contract"
path = "src/transport/cloudflare_contract_test.rs"
required-features = ["cloudflare"]

[dependencies]
peri-time = { path = "../peri-time" }
async-trait.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
reqwest = { workspace = true, features = ["stream"] }
rand = "0.10"
url = { workspace = true, features = ["serde"] }

[dev-dependencies]

[target.'cfg(target_os = "emscripten")'.dependencies]
wasm-bindgen = { version = "=0.2.129", optional = true }
wasm-bindgen-futures = { version = "=0.4.79", optional = true }
js-sys = { version = "0.3", optional = true }

[target.'cfg(target_os = "emscripten")'.dev-dependencies]
wasm-bindgen = "=0.2.129"
js-sys = "0.3"
