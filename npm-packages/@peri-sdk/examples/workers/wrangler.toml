name = "peri-wasm-local-probe"
main = "dist/worker.js"
compatibility_date = "2026-10-03"
compatibility_flags = ["nodejs_compat"]
no_bundle = true
base_dir = "dist"

[[rules]]
type = "ESModule"
# Emscripten 的 wasm-bindgen 片段由 peri-wasm.js 以相对路径导入，必须按模块附加。
globs = ["peri-wasm.js", "wasm-node.js", "snippets/**/*.js"]
fallthrough = true
