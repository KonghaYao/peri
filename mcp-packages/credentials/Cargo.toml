[package]
name = "peri-mcp-credentials"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Database-backed OAuth credential bootstrap MCP capability"
license = "Apache-2.0"

[dependencies]
peri-time = { path = "../../peri-time" }
peri-acp-types = { path = "../../peri-acp-types" }
rmcp = { workspace = true, features = ["client", "auth"] }
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

[target.'cfg(not(target_os = "emscripten"))'.dependencies]
peri-model = { path = "../../peri-model" }
async-trait.workspace = true
serde.workspace = true
tokio-util.workspace = true
tokio = { workspace = true, features = ["net"] }
reqwest = { workspace = true, features = ["form", "stream"] }
url.workspace = true
uuid.workspace = true
sha2.workspace = true
base64 = "0.22"
ring = "0.17.14"
tempfile.workspace = true

[target.'cfg(target_os = "emscripten")'.dependencies]
wasm-bindgen-futures = "0.4"

[dev-dependencies]
async-trait.workspace = true
peri-resources = { path = "../../peri-resources" }
tempfile.workspace = true
