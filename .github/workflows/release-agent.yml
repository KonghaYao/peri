name: Release Agent

on:
    push:
        tags:
            - "agent-v*"

env:
    CARGO_TERM_COLOR: always

jobs:
    # sidecar 生成前置（与 pre-release 共用同一份实现）。失败即矩阵整体不启动：
    # 基线 v4.0.2 的失败点是六平台 Rust 编译全部完成之后才在打包阶段发现
    # npm-packages/@peri-workflow/dist/peri-workflow.js 不存在。
    sidecar:
        uses: ./.github/workflows/workflow-sidecar.yml

    build:
        name: Build (${{ matrix.target }})
        needs: sidecar
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: ubuntu-latest
                      target: x86_64-unknown-linux-gnu
                      platform: linux-x86_64
                      ext: ""
                    - os: ubuntu-latest
                      target: aarch64-unknown-linux-gnu
                      platform: linux-aarch64
                      ext: ""
                    - os: macos-latest
                      target: x86_64-apple-darwin
                      platform: macos-x86_64
                      ext: ""
                    - os: macos-latest
                      target: aarch64-apple-darwin
                      platform: macos-aarch64
                      ext: ""
                    - os: ubuntu-latest
                      target: riscv64gc-unknown-linux-gnu
                      platform: linux-riscv64
                      ext: ""
                    - os: windows-latest
                      target: x86_64-pc-windows-msvc
                      platform: windows-x86_64
                      ext: ".exe"

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@master
              with:
                  toolchain: 1.99.0
                  targets: ${{ matrix.target }}

            # 注册表缓存的恢复排在「需要依赖下载的准备动作」之前：紧随其后的
            # `update --workspace` 与后续 `--locked` 构建都要用索引与 crate 归档。
            # key 取根 Cargo.lock（依赖集的真实输入）—— tag 重写只改 workspace 成员
            # 的版本字段，不改变所需依赖集合，故注册表身份不受重写影响；`**/Cargo.lock`
            # 会连带匹配与本构建无关的 side-projects 锁文件，收敛到根文件。
            # patch 内容不进 key：补丁摘要已经在依赖源路径里
            # （target/peri-rmcp-patches/<patch-sha256>/…，见 scripts/cargo-rmcp-patched.sh），
            # 补丁一变 Cargo 自行失效受影响单元，比整盘冷启动划算。
            - name: Cache cargo registry
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/registry/index
                      ~/.cargo/registry/cache
                      ~/.cargo/git/db
                  key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
                  restore-keys: ${{ runner.os }}-cargo-

            - name: Set version from tag
              shell: bash
              run: |
                  VERSION="${GITHUB_REF_NAME#agent-v}"
                  echo "Setting version to ${VERSION}"
                  sed -i.bak -e "s/^version = \".*\"/version = \"${VERSION}\"/" Cargo.toml
                  rm -f Cargo.toml.bak
                  # sed 只改 Cargo.toml；--locked 构建要求 Cargo.lock 中的 workspace 成员
                  # 版本与之一致，故按同一 patch 配置同步一次 lock。
                  ./scripts/cargo-rmcp-patched.sh update --workspace

            # 这里不再缓存 target：缓存作用域与其它 tag、分支互相隔离（不同 tag 名的缓存
            # 不可互读，见 docs.github.com/actions/reference/workflows-and-actions/
            # dependency-caching），六平台各自的 release 产物缓存只有「同一个 tag 的重跑」
            # 用得上；而 actions/cache 只在 job 成功时写入，构建失败的那次重跑必然是冷启动，
            # 命中率实际为零。写入代价却是每次发布约 1GB×6 的压缩与上传，记在仓库 10GB
            # 缓存额度上。即使 tag 能回落到默认分支缓存，main 的 CI 缓存里也只有 dev/test
            # profile 的依赖产物，release 构建无法复用。
            # release 若确实需要热缓存，应由 main 上受控的预热工作流产出与之兼容的产物
            # （意味着六平台 release profile 构建），其成本必须先实测再决定，本轮不添加。

            - name: Install cross
              if: runner.os == 'Linux'
              run: cargo install cross

            # sidecar 已在前置任务里构建并通过身份校验；这里只做下载与布局，
            # 不再在本矩阵内重复构建 JS（六平台各构建一次既慢又会各自漂移）。
            - name: Download workflow sidecar
              uses: actions/download-artifact@v4
              with:
                  name: workflow-sidecar
                  path: sidecar

            - name: Build agent-tui (Linux)
              if: runner.os == 'Linux'
              shell: bash
              run: |
                  # cross 在构建前会先运行一次不带 --config 的 `cargo metadata`；
                  # 若该调用看不到 patch 配置，会按 crates.io 版本改写 Cargo.lock，
                  # 随后 `--locked` 构建直接失败。把同一份 patch 配置放进 cargo
                  # 用户级配置链（容器内随 $CARGO_HOME 挂载继承），让 cross 内部
                  # 调用与容器内 cargo 都读到同一 patch。
                  ./scripts/cargo-rmcp-patched.sh --version > /dev/null
                  cargo_home="${CARGO_HOME:-$HOME/.cargo}"
                  mkdir -p "$cargo_home"
                  cp "$(ls -t target/peri-rmcp-patches/*/cargo-config.toml | head -1)" "$cargo_home/config.toml"
                  ./scripts/cargo-rmcp-patched.sh --cross build --locked -p peri-tui --release --target ${{ matrix.target }}

            - name: Build agent-tui (non-Linux)
              if: runner.os != 'Linux'
              shell: bash
              run: ./scripts/cargo-rmcp-patched.sh build --locked -p peri-tui --release --target ${{ matrix.target }}

            # 归档根目录内的可执行文件必须叫 peri / peri.exe：mise 等安装器按归档内
            # 文件名暴露命令名，不剥离平台后缀。逐资产校验和按 <asset>.sha256 命名发布。
            # 归档同时携带随包 workflow sidecar（`peri-resources/workflow/<内容身份>/`）：
            # Rust 侧不嵌入 JS 产物，按该布局消费（peri-workflow/src/runner/artifact.rs）。
            - name: Package binaries (Unix)
              if: matrix.ext == ''
              env:
                  SIDECAR_ROOT: sidecar
                  SIDECAR_IDENTITY: ${{ needs.sidecar.outputs.identity }}
              run: |
                  mkdir -p dist/package
                  cp "target/${{ matrix.target }}/release/peri" dist/package/peri
                  chmod +x dist/package/peri
                  # 目录身份来自前置任务，不在本矩阵内由工作树重新计算 —— 重算会让
                  # 「打包成功但身份与 Rust 侧 pin 不一致」的包有活路。
                  sidecar_entry="${SIDECAR_ROOT}/peri-resources/workflow/${SIDECAR_IDENTITY}/dist/peri-workflow.js"
                  test -f "$sidecar_entry" || { echo "missing sidecar entry: $sidecar_entry" >&2; exit 1; }
                  cp -R "${SIDECAR_ROOT}/peri-resources" dist/package/peri-resources
                  tar -czf "dist/peri-${{ matrix.platform }}.tar.gz" -C dist/package peri peri-resources
                  rm -rf dist/package
                  cd dist
                  if command -v sha256sum >/dev/null 2>&1; then
                      sha256sum "peri-${{ matrix.platform }}.tar.gz" > "peri-${{ matrix.platform }}.tar.gz.sha256"
                  else
                      shasum -a 256 "peri-${{ matrix.platform }}.tar.gz" > "peri-${{ matrix.platform }}.tar.gz.sha256"
                  fi

            - name: Package binaries (Windows)
              if: matrix.ext == '.exe'
              shell: pwsh
              env:
                  SIDECAR_ROOT: sidecar
                  SIDECAR_IDENTITY: ${{ needs.sidecar.outputs.identity }}
              run: |
                  New-Item -ItemType Directory -Force -Path dist/package | Out-Null
                  Copy-Item "target/${{ matrix.target }}/release/peri.exe" "dist/package/peri.exe"
                  $sidecarEntry = "$env:SIDECAR_ROOT/peri-resources/workflow/$env:SIDECAR_IDENTITY/dist/peri-workflow.js"
                  if (-not (Test-Path $sidecarEntry)) { throw "missing sidecar entry: $sidecarEntry" }
                  Copy-Item -Recurse "$env:SIDECAR_ROOT/peri-resources" "dist/package/peri-resources"
                  Compress-Archive -Path "dist/package/*" -DestinationPath "dist/peri-${{ matrix.platform }}.zip"
                  Remove-Item -Recurse -Force dist/package
                  Set-Location dist
                  $asset = "peri-${{ matrix.platform }}.zip"
                  $hash = (Get-FileHash -Algorithm SHA256 $asset).Hash.ToLower()
                  # 显式写 LF：发布 job 用 GNU sha256sum --check 校验，CRLF 会解析失败
                  [System.IO.File]::WriteAllText("$PWD/$asset.sha256", "$hash  $asset`n")

            - name: Upload artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: binaries-${{ matrix.platform }}
                  path: dist/
                  retention-days: 7

    release:
        name: Create GitHub Release
        needs: build
        runs-on: ubuntu-latest
        permissions:
            contents: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Download all artifacts
              uses: actions/download-artifact@v4
              with:
                  path: artifacts/
                  merge-multiple: true

            - name: List artifacts
              run: ls -lR artifacts/

            # 发布前核对归档布局、逐资产校验和与 sidecar 内容身份；任一项回归都在此失败，
            # 不进入 Release。四者一致（归档元数据 / 归档内 JS 完整 sha256 / 目录身份 /
            # Rust 侧 pin）由 scripts/verify-workflow-sidecar.sh 单点校验。
            - name: Verify packages
              run: |
                  cd artifacts
                  sha256sum --check peri-*.sha256
                  for archive in peri-*.tar.gz; do
                      bash ../scripts/verify-workflow-sidecar.sh "$archive" peri
                  done
                  for archive in peri-*.zip; do
                      bash ../scripts/verify-workflow-sidecar.sh "$archive" peri.exe
                  done

            - name: Generate checksums
              run: |
                  cd artifacts
                  sha256sum peri-*.tar.gz peri-*.zip > checksums.txt
                  cat checksums.txt

            - name: Create Release
              uses: softprops/action-gh-release@v2
              with:
                  files: |
                      artifacts/*
                  generate_release_notes: true
                  draft: false
                  prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
