[package]
name = "peri-browser-gateway"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Loopback MCP and monitor gateway for Kitesurf browser sessions"
license = "Apache-2.0"

[[bin]]
name = "peri-browser"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
axum.workspace = true
base64 = "0.22"
bytes = "1"
futures.workspace = true
rmcp = { workspace = true, features = ["server", "transport-streamable-http-server"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["net", "rt-multi-thread", "signal"] }
tokio-util.workspace = true
tokio-tungstenite = "0.29"
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
uuid.workspace = true

[dev-dependencies]
rmcp = { workspace = true, features = ["client", "transport-streamable-http-client-reqwest"] }
reqwest.workspace = true
tempfile.workspace = true
