[package]
name = "peri-tui"
version.workspace = true
edition = "2024"
description = "TUI interface for Rust Agent - interactive terminal playground"

[lib]
name = "peri_tui"
path = "src/lib.rs"

[[bin]]
name = "peri"
path = "src/main.rs"

[dev-dependencies]
tempfile.workspace = true
serial_test.workspace = true
tracing-subscriber.workspace = true
[dependencies]
serde.workspace = true
peri-agent = { path = "../peri-agent" }
peri-middlewares = { path = "../peri-middlewares" }
peri-lsp = { path = "../peri-lsp" }
# ratatui-widgets（reflow.rs WordWrapper）由 ratatui 0.30 传递引入；
# status_bar.rs `model_click_areas` 复刻了该内部算法——升级本依赖或 ratatui 版本时
# 必须运行 `cargo test -p peri-tui --lib status_bar_test` 的 ground-truth 差分测试
# （详见 status_bar.rs `model_click_areas` 的升级护栏注释）。
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info", "unstable-widget-ref"] }
ratatui-kit = { version = "0.10.2", features = ["full"] }
ratatui-kit-markdown = { version = "0.3.0", features = ["markdown-highlight"] }
tokio.workspace = true
tokio-util.workspace = true
anyhow.workspace = true
chrono.workspace = true
uuid = { workspace = true, features = ["v7"] }
serde_json.workspace = true
async-trait.workspace = true
tracing.workspace = true
dirs-next.workspace = true
parking_lot.workspace = true
arboard = "3"
png = "0.18"
base64 = { version = "0.22", features = ["alloc"] }
peri-theme = { path = "../peri-theme" }
peri-acp = { path = "../peri-acp" }
peri-workflow = { path = "../peri-workflow" }
peri-acp-types = { path = "../peri-acp-types" }
peri-web-pty = { path = "../peri-web-pty" }
agent-client-protocol = { version = "1.2", features = ["unstable"] }
agent-client-protocol-schema = { version = "1.4", features = ["unstable_elicitation"] }
unicode-width = "0.2"
unicode-segmentation = "1"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
pulldown-cmark = "0.12"
clap = { version = "4", features = ["derive"] }
sysinfo.workspace = true
fluent = "0.17"
fluent-bundle = "0.16"
unic-langid = { version = "0.9", features = ["macros"] }
tokio-tungstenite = { workspace = true, features = ["rustls-tls-native-roots"] }
aes-gcm = "0.11"
ring = "0.17"
rmp-serde = "1.3"
# ── 设备到设备加密传输（r2-encrypted-transfer，Slice 1）──
# 仅本地基础：身份/密钥/握手/限额。wire 与 HTTP 客户端在 Slice 3 接入。
ed25519-dalek = "2.2"
# static_secrets 提供长期静态密钥类型（StaticSecret）；zeroize 为默认 feature。
x25519-dalek = { version = "2", features = ["static_secrets"] }
snow = "0.10"
# 4.1.6 已验证 rust-version 1.88（本机 rustc 1.96.1）且 macOS 默认启用 Keychain；
# 精确锁定，避免解析到更高 MSRV 的补丁版本。
keyring = "=4.1.6"
zeroize = "1"
thiserror.workspace = true
rand = "0.10"
futures-util = "0.3"
fuzzy-matcher = "0.3"
im = "15"
reqwest.workspace = true
# ── Slice 3：CLI 掩码输入同步码 / keystore 密码（无网络依赖）──
rpassword = "7"

[target.'cfg(not(target_os = "windows"))'.dependencies]
tikv-jemallocator.workspace = true
tikv-jemalloc-ctl.workspace = true
tikv-jemalloc-sys.workspace = true
