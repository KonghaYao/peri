name: CI

on:
    push:
        branches: [main, pre-release/main]
    pull_request:
        branches: [main, pre-release/main]

# 同一 PR 只保留最新运行；各分支的每次 push 仍独立验证。
concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
    CARGO_TERM_COLOR: always
    # 仅关闭 CI 调试信息，减少编译、链接与缓存开销；保留断言和溢出检查。
    CARGO_PROFILE_DEV_DEBUG: "0"
    CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
    build:
        name: Build (${{ matrix.os }})
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                include: >-
                    ${{ fromJSON(
                    (github.ref == 'refs/heads/pre-release/main' || github.base_ref == 'pre-release/main')
                    && '[{"os":"ubuntu-latest","target":"x86_64-unknown-linux-gnu"},{"os":"macos-latest","target":"aarch64-apple-darwin"}]'
                    || '[{"os":"ubuntu-latest","target":"x86_64-unknown-linux-gnu"},{"os":"macos-latest","target":"aarch64-apple-darwin"},{"os":"windows-latest","target":"x86_64-pc-windows-msvc"}]'
                    ) }}

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            # 平台无关的源码检查只在 Linux 执行，并在工具链和缓存恢复前快速失败。
            # §0 依赖方向 CI 门（Seam 3 完整版，PRD 决策 2）：八条边（TUI / ACP
            # 业务面 / ACP→model / Controller / Runtime / Resources / Middlewares /
            # Agent）× use 导入 + 全路径引用双模式全校验；豁免清单唯一事实源 =
            # scripts/import-exemptions.conf。
            - name: Check §0 layer imports
              if: runner.os == 'Linux'
              run: bash scripts/check-layer-imports.sh

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@master
              with:
                  toolchain: stable
                  targets: ${{ matrix.target }}
                  components: clippy

            - name: Cache cargo registry and build
              uses: Swatinem/rust-cache@v2
              with:
                  key: ${{ matrix.target }}

            - name: Build
              run: cargo build --workspace --all-targets

            - name: Install Bun
              uses: oven-sh/setup-bun@v2

            - name: Install PTC dependencies
              working-directory: npm-packages/@peri-ptc
              run: bun install --frozen-lockfile

            - name: Build PTC fixture
              working-directory: npm-packages/@peri-ptc
              run: bun run build

            # 分步记录耗时，也确保 Windows 下第一组失败不会被后续成功覆盖。
            - name: Run workspace tests (excluding middleware and MCP capabilities)
              run: >-
                  cargo test --workspace --exclude peri-middlewares
                  --exclude peri-mcp-common --exclude peri-mcp-web --exclude peri-mcp-artifact
                  --exclude peri-mcp-cron --exclude peri-mcp-lsp --exclude peri-mcp-workspace

            # 涉及进程级全局状态的测试仍须串行执行。
            - name: Run middleware and MCP capability tests (serial)
              run: >-
                  cargo test -p peri-middlewares -p peri-mcp-common -p peri-mcp-web
                  -p peri-mcp-artifact -p peri-mcp-cron -p peri-mcp-lsp -p peri-mcp-workspace
                  -- --test-threads=1

            - name: Clippy
              run: cargo clippy --workspace --all-targets -- -D warnings
