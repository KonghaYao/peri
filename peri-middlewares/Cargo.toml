[package]
name = "peri-middlewares"
version.workspace = true
edition.workspace = true
description = "Rust Agent middleware implementations, aligned with @langgraph-js/agent-middlewares"
license = "Apache-2.0"

[dependencies]
peri-agent = { path = "../peri-agent" }
peri-model = { path = "../peri-model" }
anyhow.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
futures.workspace = true
tokio = { workspace = true, features = ["process"] }
# P5.1: SubAgent stub 需要 tokio_util::sync::CancellationToken（原 v1 AgentCancellationToken 别名）。
# 与 peri-agent 共享同一 tokio-util 依赖（feature unification 自动合并 sync feature）。
tokio-util = { workspace = true }
glob = "0.3"
walkdir = "2.5"
ignore = "0.4"
gray_matter = "0.3"
dirs-next.workspace = true
serde_yaml.workspace = true
chrono.workspace = true
uuid.workspace = true
croner = "3"
tracing.workspace = true
parking_lot.workspace = true
grep = "0.4"
num_cpus = "1"
rmcp = { version = "2", features = [
    "client",
    "transport-child-process",
    "transport-streamable-http-client-reqwest",
    "auth",
] }
reqwest = { workspace = true, features = ["gzip", "brotli", "deflate"] }
url.workspace = true
regex = "1"
flate2 = "1"
tar = "0.4"

shellexpand = "3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
base64 = { version = "0.22", features = ["alloc"] }
ipnet = "2.10"
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }
peri-lsp = { path = "../peri-lsp" }
lsp-types.workspace = true
peri-workflow = { path = "../peri-workflow" }


[dev-dependencies]
tempfile.workspace = true
filetime = "0.2"
