# lefthook.yml - Git hooks managed by lefthook
# Install: lefthook install
# Run manually: lefthook run pre-commit

pre-commit:
  parallel: false
  commands:
    fmt:
      glob: "*.rs"
      run: cargo fmt --check
      fix: cargo fmt

    check:
      glob: "*.rs"
      run: cargo check

    clippy:
      glob: "*.rs"
      run: cargo clippy -- -W clippy::all

    typos:
      run: typos

    # §0 依赖方向 CI 门（Seam 3，PRD 决策 2）：Resources 层不越层 import 业务 crate。
    # 无 glob——无论改哪个文件都校验（依赖方向与单文件改动无必然关联）。
    resources-imports:
      run: bash scripts/check-resources-imports.sh

    # §0 依赖方向 CI 门（批 2 验收）：ACP 协议面不 import middlewares/lsp/workflow
    # 业务 crate（host/exec 执行本体豁免至 L5，测试豁免，见脚本头注释）。
    # 无 glob——依赖方向与单文件改动无必然关联。
    acp-imports:
      run: bash scripts/check-acp-imports.sh

    # doc-tests 不在 pre-commit 中运行——cargo check/clippy 不编译 doc test，
    # 显式验证用: cargo test --workspace --doc

    # security-audit:
    #   run: cargo audit
    #   未安装则运行: cargo install cargo-audit && cargo audit
