# lefthook.yml - Git hooks managed by lefthook
# Install: lefthook install
# Run manually: lefthook run pre-commit

pre-commit:
  parallel: false
  commands:
    fmt:
      glob: "*.rs"
      run: cargo fmt --check
      fix: cargo fmt

    check:
      glob: "*.rs"
      run: ./scripts/cargo-rmcp-patched.sh check --locked

    # A3 收窄：clippy 只跑本次改动直接涉及的 crate
    # （scripts/precommit-changed-crates.sh 产出 -p 参数；脚本内含边界规则）。
    # check 保持全量（类型门不放松）；全量 clippy 由 CI 兜底。
    # 无 crate 命中时直接通过、不调用 cargo。
    clippy:
      glob: "*.rs"
      run: |
        changed_crates="$(bash scripts/precommit-changed-crates.sh)"
        if [ -z "$changed_crates" ]; then
          echo "[clippy] 改动未命中任何 workspace crate，跳过（全量 clippy 见 CI）"
          exit 0
        fi
        ./scripts/cargo-rmcp-patched.sh clippy --locked $changed_crates -- -W clippy::all

    typos:
      run: typos

    # §0 依赖方向 CI 门（Seam 3 完整版，PRD 决策 2）：八条边（TUI / ACP 业务面 /
    # ACP→model / Controller / Runtime / Resources / Middlewares / Agent）×
    # use 导入 + 全路径引用双模式全校验；豁免清单唯一事实源 =
    # scripts/import-exemptions.conf（每条豁免标注归属收紧任务）。
    # 取代 check-resources-imports.sh / check-acp-imports.sh / check-tui-imports.sh。
    # 无 glob——无论改哪个文件都校验（依赖方向与单文件改动无必然关联）。
    layer-imports:
      run: bash scripts/check-layer-imports.sh

    # doc-tests 不在 pre-commit 中运行——cargo check/clippy 不编译 doc test，
    # 显式验证用: ./scripts/cargo-rmcp-patched.sh test --locked --workspace --doc

    # security-audit:
    #   run: cargo audit
    #   未安装则运行: cargo install cargo-audit && cargo audit
