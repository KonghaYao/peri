[package]
name = "peri-swarm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Peri Swarm gateway — HTTP session contract, SSE events, and typed storage ports"

[dependencies]
peri-time = { path = "../peri-time" }
# S4 runtime boundary: only `src/actor/runtime.rs` may import `peri-acp` /
# `peri-acp-types` / `peri-agent` (design §1.2). The rest of the crate consumes
# this module's own types.
peri-acp = { path = "../peri-acp" }
peri-acp-types = { path = "../peri-acp-types" }
peri-resources = { path = "../peri-resources" }
async-trait.workspace = true
axum.workspace = true
futures.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
url.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile.workspace = true
tracing-subscriber.workspace = true
tokio = { workspace = true, features = ["full"] }
tower.workspace = true
