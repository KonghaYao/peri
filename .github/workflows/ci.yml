name: CI

on:
    push:
        branches: [main, pre-release/main]
    pull_request:
        branches: [main, pre-release/main]

# 同一 PR 只保留最新运行；各分支的每次 push 仍独立验证。
concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
    CARGO_TERM_COLOR: always
    # 仅关闭 CI 调试信息，减少编译、链接与缓存开销；保留断言和溢出检查。
    CARGO_PROFILE_DEV_DEBUG: "0"
    CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
    build:
        name: Build (${{ matrix.os }})
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                include: >-
                    ${{ fromJSON('[{"os":"ubuntu-latest","target":"x86_64-unknown-linux-gnu"},{"os":"macos-latest","target":"aarch64-apple-darwin"},{"os":"windows-latest","target":"x86_64-pc-windows-msvc"}]') }}

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            # 平台无关的源码检查只在 Linux 执行，并在工具链和缓存恢复前快速失败。
            # §0 依赖方向 CI 门（Seam 3 完整版，PRD 决策 2）：八条边（TUI / ACP
            # 业务面 / ACP→model / Controller / Runtime / Resources / Middlewares /
            # Agent）× use 导入 + 全路径引用双模式全校验；豁免清单唯一事实源 =
            # scripts/import-exemptions.conf。
            - name: Check §0 layer imports
              if: runner.os == 'Linux'
              run: bash scripts/check-layer-imports.sh

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@master
              with:
                  toolchain: stable
                  targets: ${{ matrix.target }}
                  components: clippy

            - name: Install Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
              with:
                  bun-version: 1.3.1

            - name: Install SDK dependencies
              shell: bash
              working-directory: npm-packages/@peri-sdk
              run: bun install --frozen-lockfile

            - name: Cache cargo registry and build
              uses: Swatinem/rust-cache@v2
              with:
                  key: ${{ matrix.target }}

            - name: Build
              shell: bash
              run: ./scripts/cargo-rmcp-patched.sh build --locked --workspace --all-targets

            # 分步记录耗时，也确保 Windows 下第一组失败不会被后续成功覆盖。
            - name: Run workspace tests (excluding middleware and MCP capabilities)
              shell: bash
              run: >-
                  ./scripts/cargo-rmcp-patched.sh test --locked --workspace --exclude peri-agent --exclude peri-tui --exclude peri-middlewares
                  --exclude peri-mcp-common --exclude peri-mcp-web --exclude peri-mcp-artifact
                  --exclude peri-mcp-cron --exclude peri-mcp-workspace

            - name: Run Agent tests (excluding execution E2E)
              shell: bash
              run: |
                  ./scripts/cargo-rmcp-patched.sh test --locked -p peri-agent --lib
                  ./scripts/cargo-rmcp-patched.sh test --locked -p peri-agent --test middleware_tests --test compact_followup_behavior_test --test compact_failure_adversarial_test

            - name: Run TUI tests (excluding real CLI continuation E2E)
              shell: bash
              run: |
                  ./scripts/cargo-rmcp-patched.sh test --locked -p peri-tui --lib --bins --test meta_session_cli --test print_bare
                  ./scripts/cargo-rmcp-patched.sh test --locked -p peri-tui --test print_exit -- --skip truncated_answer_recovers_and_exits_process_successfully

            # 涉及进程级全局状态的测试仍须串行执行。
            - name: Run middleware unit tests (serial, excluding E2E)
              shell: bash
              run: >-
                  ./scripts/cargo-rmcp-patched.sh test --locked -p peri-middlewares --lib
                  -- --test-threads=1 --skip subagent::tool --skip mcp::workspace_recovery_tests
                  --skip mcp::workspace_builtin_tests::bridge_accepts_workspace_owned_task_handle

            - name: Run MCP capability tests (serial)
              shell: bash
              run: >-
                  ./scripts/cargo-rmcp-patched.sh test --locked -p peri-mcp-common -p peri-mcp-web
                  -p peri-mcp-artifact -p peri-mcp-cron -p peri-mcp-workspace -- --test-threads=1

            - name: Clippy
              shell: bash
              run: ./scripts/cargo-rmcp-patched.sh clippy --locked --workspace --all-targets -- -D warnings
