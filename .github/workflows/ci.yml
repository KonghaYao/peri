name: CI

on:
    push:
        branches: [main, pre-release/main]
    pull_request:
        branches: [main, pre-release/main]

# 同一 PR 只保留最新运行；各分支的每次 push 仍独立验证。
concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
    CARGO_TERM_COLOR: always
    # 仅关闭 CI 调试信息，减少编译、链接与缓存开销；保留断言和溢出检查。
    CARGO_PROFILE_DEV_DEBUG: "0"
    CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
    # 变更分类：只有全部受影响路径都落在「已确认不影响构建与测试」的文档白名单内，
    # 才跳过 Rust 三平台任务。判定规则与白名单见 scripts/ci-classify-changes.sh。
    changes:
        name: Classify changes
        runs-on: ubuntu-latest
        timeout-minutes: 5
        outputs:
            docs_only: ${{ steps.classify.outputs.docs_only }}
            reason: ${{ steps.classify.outputs.reason }}
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7
              with:
                  # 分类要比较 base..head 的实际 diff。默认浅克隆拿不到 base 提交，
                  # 那种情况下分类会回退成完整验证（安全，只是不省）。
                  fetch-depth: 0
                  persist-credentials: false

            - name: Classify changed paths
              id: classify
              env:
                  EVENT_NAME: ${{ github.event_name }}
                  PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
                  PUSH_BEFORE_SHA: ${{ github.event.before }}
                  CI_HEAD_SHA: ${{ github.sha }}
              run: bash scripts/ci-classify-changes.sh

    build:
        name: Build (${{ matrix.os }})
        needs: changes
        # 纯文档变更不启动 Rust 三平台任务；其余一律完整验证。
        if: needs.changes.outputs.docs_only != 'true'
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                include: >-
                    ${{ fromJSON('[{"os":"ubuntu-latest","target":"x86_64-unknown-linux-gnu"},{"os":"macos-latest","target":"aarch64-apple-darwin"},{"os":"windows-latest","target":"x86_64-pc-windows-msvc"}]') }}

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            # 平台无关的源码检查只在 Linux 执行，并在工具链和缓存恢复前快速失败。
            # §0 依赖方向 CI 门（Seam 3 完整版，PRD 决策 2）：八条边（TUI / ACP
            # 业务面 / ACP→model / Controller / Runtime / Resources / Middlewares /
            # Agent）× use 导入 + 全路径引用双模式全校验；豁免清单唯一事实源 =
            # scripts/import-exemptions.conf。
            - name: Check §0 layer imports
              if: runner.os == 'Linux'
              run: bash scripts/check-layer-imports.sh

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@master
              with:
                  toolchain: stable
                  targets: ${{ matrix.target }}
                  components: clippy

            - name: Cache cargo registry and build
              uses: Swatinem/rust-cache@v2
              with:
                  key: ${{ matrix.target }}

            - name: Build
              shell: bash
              run: ./scripts/cargo-rmcp-patched.sh build --locked --workspace --all-targets

            # 分步记录耗时，也确保 Windows 下第一组失败不会被后续成功覆盖。
            - name: Run workspace tests (excluding ACP, middleware and MCP capabilities)
              shell: bash
              run: >-
                  ./scripts/cargo-rmcp-patched.sh test --locked --workspace --exclude peri-acp --exclude peri-agent --exclude peri-tui --exclude peri-middlewares
                  --exclude peri-mcp-common --exclude peri-mcp-web --exclude peri-mcp-artifact
                  --exclude peri-mcp-cron --exclude peri-mcp-workspace

            - name: Run ACP tests (excluding SDK E2E)
              shell: bash
              run: >-
                  ./scripts/cargo-rmcp-patched.sh test --locked -p peri-acp --lib
                  -- --skip host::execution_admission_jsonl --skip host::scheduled_admission

            - name: Run Agent tests (excluding execution E2E)
              shell: bash
              run: |
                  ./scripts/cargo-rmcp-patched.sh test --locked -p peri-agent --lib
                  ./scripts/cargo-rmcp-patched.sh test --locked -p peri-agent --test middleware_tests --test compact_followup_behavior_test --test compact_failure_adversarial_test

            # ARC-COMPACT-001 Verify：Compact 三套对抗套件必须真实执行且命中非零用例。
            - name: Run Compact adversarial suites (ARC-COMPACT-001)
              shell: bash
              run: >-
                  ./scripts/cargo-rmcp-patched.sh test --locked -p peri-agent
                  --test compact_pressure_adversarial_test --test compact_session_adversarial_test
                  --test compact_authority_projection_test

            - name: Run TUI tests (excluding SDK E2E)
              shell: bash
              run: >-
                  ./scripts/cargo-rmcp-patched.sh test --locked -p peri-tui --lib --bins --test meta_session_cli
                  -- --skip sdk_execution::tests::real_sdk

            # 涉及进程级全局状态的测试仍须串行执行。
            - name: Run middleware unit tests (serial, excluding E2E)
              shell: bash
              run: >-
                  ./scripts/cargo-rmcp-patched.sh test --locked -p peri-middlewares --lib
                  -- --test-threads=1 --skip subagent::tool --skip mcp::workspace_recovery_tests
                  --skip mcp::workspace_builtin_tests::bridge_accepts_workspace_owned_task_handle
                  --skip mcp::tool_bridge::tests::builtin_tool_call_surfaces_timeout_error_after_bridge_deadline

            - name: Run MCP capability tests (serial)
              shell: bash
              run: >-
                  ./scripts/cargo-rmcp-patched.sh test --locked -p peri-mcp-common -p peri-mcp-web
                  -p peri-mcp-artifact -p peri-mcp-cron -p peri-mcp-workspace -- --test-threads=1

            - name: Clippy
              shell: bash
              run: |
                  if [[ "$RUNNER_OS" == "Windows" ]]; then
                      ./scripts/cargo-rmcp-patched.sh clippy --locked --workspace --lib --bins -- -D warnings
                  else
                      ./scripts/cargo-rmcp-patched.sh clippy --locked --workspace --all-targets -- -D warnings
                  fi

    # 汇总检查：只要本 job 运行就给出确定的结论 —— 区分「文档按策略跳过」与
    # 「代码测试失败 / 取消 / 意外跳过」，避免后者被读成通过。
    #
    # 关于 required check：GitHub 的「Troubleshooting required status checks」明确
    # 「A job is skipped by a conditional → The job reports "Success"」，而**工作流**
    # 级跳过（path/branch 过滤）才会停在 Pending。因此 build 用 job 级 `if:` 跳过
    # 不会阻塞合并；本 job 存在是为了给「跳过」一个显式、可读的结论，并可选地作为
    # 单一 required check（job 名称是稳定标识，改名需同步分支保护配置）。
    ci-result:
        name: CI result
        if: always()
        needs: [changes, build]
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - name: Summarize
              env:
                  CHANGES_RESULT: ${{ needs.changes.result }}
                  BUILD_RESULT: ${{ needs.build.result }}
                  DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
                  DOCS_REASON: ${{ needs.changes.outputs.reason }}
              run: |
                  set -euo pipefail
                  printf 'changes=%s build=%s docs_only=%s\n' \
                      "$CHANGES_RESULT" "$BUILD_RESULT" "$DOCS_ONLY"
                  printf 'reason: %s\n' "$DOCS_REASON"

                  if [[ "$CHANGES_RESULT" != "success" ]]; then
                      printf '::error::变更分类未成功（%s），无法确认能否跳过重型任务\n' "$CHANGES_RESULT" >&2
                      exit 1
                  fi

                  if [[ "$DOCS_ONLY" == "true" ]]; then
                      printf 'docs-only：按策略跳过 Rust 三平台任务，汇总检查通过\n'
                      exit 0
                  fi

                  # 非 docs-only 时三平台任务必须真跑且成功；skipped 说明触发条件
                  # 出了问题，不能当成通过。
                  if [[ "$BUILD_RESULT" != "success" ]]; then
                      printf '::error::Rust 三平台任务结果 = %s（期望 success）\n' "$BUILD_RESULT" >&2
                      exit 1
                  fi

                  printf '完整验证通过\n'
