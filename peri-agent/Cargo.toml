[package]
name = "peri-agent"
version.workspace = true
edition.workspace = true
description = "Rust Agent framework with middleware system, aligned with @langgraph-js/standard-agent"
license = "Apache-2.0"

[dependencies]
peri-time = { path = "../peri-time" }
anyhow.workspace = true
async-trait.workspace = true
chrono.workspace = true
dirs-next.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
thiserror.workspace = true
futures.workspace = true
tokio.workspace = true
uuid.workspace = true
sha2.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
tokio-util.workspace = true
parking_lot.workspace = true
peri-model = { path = "../peri-model" }
peri-acp-types = { path = "../peri-acp-types" }
sysinfo.workspace = true

[dev-dependencies]
libc = "0.2"
tokio = { workspace = true, features = ["test-util"] }
tempfile.workspace = true
url.workspace = true

[target.'cfg(not(target_os = "emscripten"))'.dependencies]
tokio = { workspace = true, features = ["full"] }
peri-resources = { path = "../peri-resources" }
