# lefthook.yml - Git hooks managed by lefthook
# Install: lefthook install
# Run manually: lefthook run pre-commit

pre-commit:
  parallel: true
  commands:
    fmt:
      glob: "*.rs"
      run: cargo fmt --check
      fix: cargo fmt

    check:
      glob: "*.rs"
      run: cargo check

    clippy:
      glob: "*.rs"
      run: cargo clippy -- -W clippy::all

    typos:
      run: typos

    doc-tests:
      run: cargo test --workspace --doc

    # security-audit:
    #   run: cargo audit
    #   未安装则运行: cargo install cargo-audit && cargo audit
