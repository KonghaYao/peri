[default.extend-words]
# ratatui is the name of the Rust TUI library, not a misspelling of ratatouille
ratatui = "ratatui"
# intentional abbreviations / variable names
fo = "fo"
hel = "hel"
# test data and file references
fle = "fle"
gti = "gti"
bulder = "bulder"

[default]
# commit hash / 十六进制标识符不是拼写错误（如 59ba70b8 中的 ba）
extend-ignore-re = ["\\b[0-9a-f]{7,40}\\b"]

[files]
extend-exclude = ["Cargo.lock", "side-projects/", "worktrees/", "target/", ".git/"]
