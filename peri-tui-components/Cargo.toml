[package]
name = "peri-tui-components"
version.workspace = true
edition = "2024"
rust-version.workspace = true
description = "Business-independent terminal input, list and hit-testing primitives"

[dependencies]
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info", "unstable-widget-ref"] }
ratatui-kit = { version = "0.12.0", default-features = false }
ratatui-kit-markdown = { version = "0.3.0", features = ["markdown-highlight"] }
pulldown-cmark-012 = { package = "pulldown-cmark", version = "0.12" }
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
unicode-width = "0.2"
unicode-segmentation = "1"
parking_lot.workspace = true
tracing.workspace = true
serde_json.workspace = true
peri-genui = { path = "../peri-genui" }
peri-theme = { path = "../peri-theme" }
tui-chart = { version = "0.6.6", default-features = false, features = ["theme", "piechart"] }

[dev-dependencies]
serial_test.workspace = true
