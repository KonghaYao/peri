name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

env:
    CARGO_TERM_COLOR: always

jobs:
    build:
        name: Build (${{ matrix.os }})
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, macos-latest, windows-latest]
                rust:
                    - stable
                include:
                    - os: ubuntu-latest
                      target: x86_64-unknown-linux-gnu
                    - os: macos-latest
                      target: aarch64-apple-darwin
                    - os: windows-latest
                      target: x86_64-pc-windows-msvc

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@master
              with:
                  toolchain: ${{ matrix.rust }}
                  targets: ${{ matrix.target }}

            - name: Cache cargo registry and build
              uses: Swatinem/rust-cache@v2
              with:
                  key: ${{ matrix.target }}

            # §0 依赖方向 CI 门（Seam 3 完整版，PRD 决策 2）：八条边（TUI / ACP
            # 业务面 / ACP→model / Controller / Runtime / Resources / Middlewares /
            # Agent）× use 导入 + 全路径引用双模式全校验；豁免清单唯一事实源 =
            # scripts/import-exemptions.conf。
            - name: Check §0 layer imports
              run: bash scripts/check-layer-imports.sh

            - name: Build
              run: cargo build --workspace --all-targets

            - name: Run tests
              run: cargo test --workspace

            - name: Clippy
              run: cargo clippy --workspace --all-targets -- -D warnings
