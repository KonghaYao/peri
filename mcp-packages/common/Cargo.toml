[package]
name = "peri-mcp-common"
version.workspace = true
edition.workspace = true
description = "Shared behavior for Peri builtin MCP instances"
license = "Apache-2.0"

[dependencies]
peri-time = { path = "../../peri-time" }
peri-agent = { path = "../../peri-agent" }
peri-acp-types = { path = "../../peri-acp-types" }
peri-process = { path = "../../peri-process" }
chrono.workspace = true
base64 = { version = "0.22", features = ["alloc"] }
fs2 = "0.4"
futures.workspace = true
libc = "0.2"
parking_lot.workspace = true
rmcp.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(not(target_os = "emscripten"))'.dependencies]
tokio = { workspace = true, features = ["full"] }
