[package]
name = "peri-browser-cdp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Shared CDP page-connection layer for the peri-browser MCP and monitor gateway"
license = "Apache-2.0"

[dependencies]
async-trait.workspace = true
base64 = "0.22"
bytes = "1"
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["net"] }
# Both the MCP page sessions and the gateway viewers are WebSocket clients.
tokio-tungstenite = "0.29"
tracing.workspace = true
url.workspace = true

[dev-dependencies]
# The unit tests stand up a minimal CDP endpoint with axum.
axum.workspace = true
