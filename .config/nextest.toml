# cargo nextest 配置：把「测试选择」与「Cargo 编译图」分离。
#
# CI 里所有 nextest 调用都使用同一组 Cargo 参数（`--locked --workspace`），
# 各步骤的测试范围差异只落在命令行 `-E` 过滤器上。nextest 的构建阶段不参与过滤
# （先按 `cargo test --no-run` 语义构建全部测试二进制，再决定运行哪些），因此
# 包集合、target、profile 与 feature 投影在整个 job 内保持恒定，步骤切换不再
# 触发依赖重编译。
#
# 这里只放「跨步骤共享、且与 Cargo 选择无关」的规则；每个步骤的范围写在
# .github/workflows/ci.yml 对应步骤的 `-E` 里，便于就地 review。
# scripts/ci-test-inventory.sh --check 会核对两侧一致。
#
# 版本下限：default-filter 需要 0.9.84，`--no-tests` 默认 fail 需要 0.9.85，
# `[profile.ci]` 的继承与 global-timeout 需要 0.9.148。CI 与本地均用 0.9.148。
nextest-version = "0.9.148"

[profile.default]
# 原有 E2E 跳过条件按 package + test 精确迁移，不用裸 `test(...)`：裸匹配会连带
# 排除其他包里同名的测试。这些用例按既有范围保留：真实 SDK、外部进程或进程级时序假设。
# `subagent::tool` 全部使用本地 mock 模型与临时 SQLite，不属于外部依赖，不在此列。
default-filter = "not (package(=peri-acp) & test(host::execution_admission_jsonl) | package(=peri-acp) & test(host::scheduled_admission) | package(=peri-tui) & test(sdk_execution::tests::real_sdk) | package(=peri-middlewares) & test(mcp::workspace_recovery_tests) | package(=peri-middlewares) & test(mcp::workspace_builtin_tests::bridge_accepts_workspace_owned_task_handle) | package(=peri-middlewares) & test(mcp::tool_bridge::tests::builtin_tool_call_surfaces_timeout_error_after_bridge_deadline))"

# 互斥组：把串行额度收窄到「迁移前靠 --test-threads=1 隐式串行」的那些测试，
# 而不是整个测试运行。其余测试按正常的 num-cpus 额度并行。
#
# 迁移前的串行范围与原因：peri-middlewares 的 lib 单元测试，以及 6 个 MCP 能力包的
# 全部 target。libtest 会把同一二进制内的测试放在线程里并发执行，这些用例改写进程级
# 全局状态（std::env 的 HOME / PERI_* 、全局 config path 单例、TUI 全局 atom、
# OnceLock / 静态 Mutex），只能靠 --test-threads=1 兜住。
#
# nextest 是一个测试一个进程，上述进程内状态不再跨测试共享，这类冲突在结构上消失；
# 仓库中所有 `#[serial]` / `serial_test::serial` 标注保护的都是这一类状态，因此
# 不需要为它们建组。跨进程共享的资源不受进程隔离保护，但目前的实现是文件排他锁
# （peri_mcp_common::process_env::lock()，基于 fs4），在 nextest 下依然有效。
#
# 因此这里不下「已经证明无冲突」的结论，而是先复刻迁移前的范围：与迁移前等价、
# 零回归；同时记录迁移新增的并行面 —— nextest 允许不同测试二进制的用例同时运行
# （迁移前 cargo test 逐个二进制串行执行、只在二进制内部按线程并发）。待实测候选：
#   - mcp-packages/common 的 shell 类测试、mcp-packages/workspace 的非 terminal 测试
#   - mcp-packages/config 的全局 CLIENT 单例、mcp-packages/cron 的时间敏感用例
#   - peri-process/tests/pty_isolation.rs、peri-workflow 的真实 node 用例
#   - 同一包内 lib 二进制与多个集成测试二进制之间的重叠
# 收窄条件：某包连续三次三平台通过、且没有新增重试配置，即可移出组；出现一次竞态
# 证据（而不是推测）则把对应测试并入组，并把证据记在此处。
#
# 已记录证据（配置未变，原因随附）：
#   - 2026-10-12 PR #186 第二轮 macOS：
#     peri-mcp-workspace 的 terminal::tests::lifecycle_tests::
#     test_cancelled_foreground_shell_retains_owner_until_process_exit 断言
#     TaskManager::shutdown 报 Complete，实得 Incomplete；耗时 3.04s，未到
#     scope.wait() 的 5s 超时，即卡在 unsettled_external / pending_deliveries 未清空的
#     结算竞态。该包的每个 target 都已在组内串行，重跑即通过，故这条证据不指向并行竞态，
#     收窄条件仍未满足（三平台连续三次尚未达成）；若再次出现，优先按「整段互斥」回退，
#     不要放宽断言。
[test-groups]
serial-process-state = { max-threads = 1 }
# 真实子进程 / 监听器 / 独立 state 文件的用例：主调用把它们和新并入的 ACP、TUI、
# middlewares 放进同一个进程池后，这些用例会同时拉起子进程和本地监听器。它们各自
# 用 127.0.0.1:0 与临时 HOME 隔离，不共享固定端口，但并发回收进程树（尤其 Windows）
# 与竞争文件句柄会让失败原因不可区分；串起来后失败只指向用例本身。
# 规模：peri-process 的 4 个 PTY 用例、peri-swarm 里绑定真实监听器的 5 个集成目标。
# 其余 peri-swarm 单元测试仍在池内并行。
# peri-swarm 的集成测试已并入单二进制 `it`，因此按测试名（`<module>::`）而不是
# binary 名定位，保持隔离集合不变。
process-isolation = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'package(=peri-middlewares) & kind(lib)'
test-group = 'serial-process-state'

[[profile.default.overrides]]
filter = 'package(=peri-mcp-common) | package(=peri-mcp-web) | package(=peri-mcp-artifact) | package(=peri-mcp-cron) | package(=peri-mcp-monitor) | package(=peri-mcp-workspace)'
test-group = 'serial-process-state'

[[profile.default.overrides]]
filter = '(package(=peri-process) | (package(=peri-swarm) & test(/^(actor_runtime_test|mcp_injection_test|openai_hosted_test|rivet_actor_test|state_store_failure_test|state_store_test)::/)))'
test-group = 'process-isolation'

# CI 专用 profile：继承 [profile.default] 的 default-filter、overrides 与 test-groups，
# 只追加挂起防护。单个测试超过 period=60s 标记 slow，再跑满 terminate-after=2 个
# period（约 120s）后被终止，随后留 grace-period=10s 收集输出并关闭进程树
# （Windows 不支持 grace，按 120s 计）。整轮 50m 封顶，job 的 timeout-minutes: 60
# 仍是最后兜底。retries=0 避免重试掩盖 flake；fail-fast=false 让一次挂起不遮挡其余
# 用例的失败，评审能看到完整失败面。
[profile.ci]
slow-timeout = { period = "60s", terminate-after = 2, grace-period = "10s" }
retries = 0
fail-fast = false
global-timeout = "50m"

# 已知长测试：单用例在 CI（Windows 冷缓存、单核调度）会稳定超过 120s，放宽到
# 2×120s。按测试名定位（`#[path]` 引入的模块名不等于文件名），避免连带放宽同包
# 其他用例；新增 override 前先确认过滤表达式实际命中的测试。
[[profile.ci.overrides]]
filter = 'package(=peri-tui) & test(/^kit::steer_consumer::tests::/)'
slow-timeout = { period = "120s", terminate-after = 2 }

[[profile.ci.overrides]]
filter = 'package(=peri-agent) & test(/^session::subagent::child_runner::tests::/)'
slow-timeout = { period = "120s", terminate-after = 2 }

[[profile.ci.overrides]]
filter = 'package(=peri-agent) & test(/^session::subagent::tests::parked_inbox::/)'
slow-timeout = { period = "120s", terminate-after = 2 }

[[profile.ci.overrides]]
filter = 'package(=peri-acp) & test(/^host::requests::tests::activation_tests::budget_activation_tests::/)'
slow-timeout = { period = "120s", terminate-after = 2 }
