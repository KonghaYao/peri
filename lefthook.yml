# lefthook.yml - Git hooks managed by lefthook
# Install: lefthook install
# Run manually: lefthook run pre-commit

pre-commit:
  parallel: true
  commands:
    fmt:
      glob: "*.rs"
      run: cargo fmt --check
      fix: cargo fmt

    check:
      glob: "*.rs"
      run: cargo check

    clippy:
      glob: "*.rs"
      run: cargo clippy -- -W clippy::all

    typos:
      run: typos
