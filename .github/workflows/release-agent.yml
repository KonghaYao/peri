name: Release Agent

on:
    push:
        tags:
            - "agent-v*"

env:
    CARGO_TERM_COLOR: always

jobs:
    build:
        name: Build (${{ matrix.target }})
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: ubuntu-latest
                      target: x86_64-unknown-linux-gnu
                      platform: linux-x86_64
                      ext: ""
                    - os: ubuntu-latest
                      target: aarch64-unknown-linux-gnu
                      platform: linux-aarch64
                      ext: ""
                    - os: macos-latest
                      target: x86_64-apple-darwin
                      platform: macos-x86_64
                      ext: ""
                    - os: macos-latest
                      target: aarch64-apple-darwin
                      platform: macos-aarch64
                      ext: ""
                    - os: ubuntu-latest
                      target: riscv64gc-unknown-linux-gnu
                      platform: linux-riscv64
                      ext: ""
                    - os: windows-latest
                      target: x86_64-pc-windows-msvc
                      platform: windows-x86_64
                      ext: ".exe"

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Set version from tag
              shell: bash
              run: |
                  VERSION="${GITHUB_REF_NAME#agent-v}"
                  echo "Setting version to ${VERSION}"
                  sed -i.bak -e "s/^version = \".*\"/version = \"${VERSION}\"/" Cargo.toml
                  rm -f Cargo.toml.bak

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: ${{ matrix.target }}

            - name: Cache cargo registry
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/registry/index
                      ~/.cargo/registry/cache
                      ~/.cargo/git/db
                  key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
                  restore-keys: ${{ runner.os }}-cargo-

            - name: Cache build artifacts
              uses: actions/cache@v4
              with:
                  path: target
                  key: ${{ runner.os }}-${{ matrix.target }}-build-${{ hashFiles('**/Cargo.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-${{ matrix.target }}-build-
                      ${{ runner.os }}-${{ matrix.target }}-

            - name: Install cross
              if: runner.os == 'Linux'
              run: cargo install cross

            - name: Build agent-tui (Linux)
              if: runner.os == 'Linux'
              shell: bash
              run: ./scripts/cargo-rmcp-patched.sh --cross build --locked -p peri-tui --release --target ${{ matrix.target }}

            - name: Build agent-tui (non-Linux)
              if: runner.os != 'Linux'
              shell: bash
              run: ./scripts/cargo-rmcp-patched.sh build --locked -p peri-tui --release --target ${{ matrix.target }}

            # 归档根目录内的可执行文件必须叫 peri / peri.exe：mise 等安装器按归档内
            # 文件名暴露命令名，不剥离平台后缀。逐资产校验和按 <asset>.sha256 命名发布。
            - name: Package binaries (Unix)
              if: matrix.ext == ''
              run: |
                  mkdir -p dist/package
                  cp "target/${{ matrix.target }}/release/peri" dist/package/peri
                  chmod +x dist/package/peri
                  tar -czf "dist/peri-${{ matrix.platform }}.tar.gz" -C dist/package peri
                  rm -rf dist/package
                  cd dist
                  if command -v sha256sum >/dev/null 2>&1; then
                      sha256sum "peri-${{ matrix.platform }}.tar.gz" > "peri-${{ matrix.platform }}.tar.gz.sha256"
                  else
                      shasum -a 256 "peri-${{ matrix.platform }}.tar.gz" > "peri-${{ matrix.platform }}.tar.gz.sha256"
                  fi

            - name: Package binaries (Windows)
              if: matrix.ext == '.exe'
              shell: pwsh
              run: |
                  New-Item -ItemType Directory -Force -Path dist/package | Out-Null
                  Copy-Item "target/${{ matrix.target }}/release/peri.exe" "dist/package/peri.exe"
                  Compress-Archive -Path "dist/package/peri.exe" -DestinationPath "dist/peri-${{ matrix.platform }}.zip"
                  Remove-Item -Recurse -Force dist/package
                  Set-Location dist
                  $asset = "peri-${{ matrix.platform }}.zip"
                  $hash = (Get-FileHash -Algorithm SHA256 $asset).Hash.ToLower()
                  # 显式写 LF：发布 job 用 GNU sha256sum --check 校验，CRLF 会解析失败
                  [System.IO.File]::WriteAllText("$PWD/$asset.sha256", "$hash  $asset`n")

            - name: Upload artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: binaries-${{ matrix.platform }}
                  path: dist/
                  retention-days: 7

    release:
        name: Create GitHub Release
        needs: build
        runs-on: ubuntu-latest
        permissions:
            contents: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Download all artifacts
              uses: actions/download-artifact@v4
              with:
                  path: artifacts/
                  merge-multiple: true

            - name: List artifacts
              run: ls -lR artifacts/

            # 发布前核对归档布局与逐资产校验和；布局回归在此处失败，不进入 Release。
            - name: Verify packages
              run: |
                  cd artifacts
                  sha256sum --check peri-*.sha256
                  for archive in peri-*.tar.gz; do
                      test "$(tar -tzf "$archive")" = peri
                  done
                  test "$(unzip -Z1 peri-*.zip)" = peri.exe

            - name: Generate checksums
              run: |
                  cd artifacts
                  sha256sum peri-*.tar.gz peri-*.zip > checksums.txt
                  cat checksums.txt

            - name: Create Release
              uses: softprops/action-gh-release@v2
              with:
                  files: |
                      artifacts/*
                  generate_release_notes: true
                  draft: false
                  prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
