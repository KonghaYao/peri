<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="https://unpkg.com/xterm@5.3.0/css/xterm.css">
  <link rel="stylesheet" href="/css/theme.css">
  <style type="text/tailwindcss">
    /* xterm 第三方覆盖（无法用工具类表达） */
    .xterm { height: 100%; }
    .xterm-viewport::-webkit-scrollbar { display: none; }
    .xterm-viewport { scrollbar-width: none; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "solid-js": "https://unpkg.com/solid-js@1.9.3/dist/solid.js",
      "solid-js/web": "https://unpkg.com/solid-js@1.9.3/web/dist/web.js",
      "solid-js/html": "https://unpkg.com/solid-js@1.9.3/html/dist/html.js",
      "comlink": "https://unpkg.com/comlink@4.4.1/dist/esm/comlink.mjs"
    }
  }
  </script>
</head>
<body>
  <div id="app" class="flex flex-col h-full"></div>

  <script src="https://unpkg.com/xterm@5.3.0/lib/xterm.js"></script>
  <script src="https://unpkg.com/@xterm/addon-fit@0.11.0/lib/addon-fit.js"></script>
  <script src="https://unpkg.com/@xterm/addon-web-links@0.12.0/lib/addon-web-links.js"></script>

  <script type="module">
    import { render } from 'solid-js/web';
    import html from 'solid-js/html';
    import { TerminalTabs } from '/lib/terminal/TerminalTabs.js';

    render(() => html`<${TerminalTabs} />`, document.getElementById('app'));
  </script>
</body>
</html>
