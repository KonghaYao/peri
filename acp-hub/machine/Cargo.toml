[package]
name = "acp-machine"
version.workspace = true
edition.workspace = true
description = "acp-hub machine：outbound 连 server、管理 ACP 进程树、透明转发 + 断线缓冲（由原 acp-hub 单机版演化）"

[[bin]]
name = "acp-machine"
path = "src/main.rs"

[[bin]]
name = "test-child"
path = "src/bin/test_child.rs"
test = false  # 不是测试目标，是集成测试用的假 ACP 进程

[lib]
name = "acp_machine"
path = "src/lib.rs"

[dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
tokio-util = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true, features = ["derive", "rc"] }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt", "json"] }
clap = { workspace = true, features = ["derive", "env"] }
anyhow = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true, features = ["v4", "v7", "serde"] }
chrono = { workspace = true, features = ["serde"] }
dirs-next = { workspace = true }
tokio-tungstenite = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
hkdf = { workspace = true }
base64 = { workspace = true }
rand = { workspace = true }
libc = { workspace = true }
acp-hub-proto = { path = "../proto" }
agent-client-protocol-schema = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
serial_test = { workspace = true }
