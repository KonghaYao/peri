[package]
name = "peri-swarm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Peri Swarm gateway — HTTP session contract, SSE events, and typed storage ports"

# 进程入口没有单元测试，显式声明 bin 只为关掉空的测试 harness 链接。
[[bin]]
name = "peri-swarm"
path = "src/main.rs"
test = false

[dependencies]
peri-time = { path = "../peri-time" }
# S4 runtime boundary: only `src/actor/runtime/`, `src/store/remote.rs` and
# the `bootstrap` process entry may import `peri-acp` / `peri-acp-types` /
# `peri-resources` (design §1.2). The rest of the crate consumes their own
# types: `store` owns the persistence port, `bootstrap` owns the process store.
peri-acp = { path = "../peri-acp" }
peri-acp-types = { path = "../peri-acp-types" }
peri-resources = { path = "../peri-resources" }
# The Swarm state database is its own PostgreSQL database. Only
# `src/store/postgres/` uses the driver directly; it never goes through the
# `peri-resources` schema probe/initialization for the Peri session store.
# Feature set matches `peri-resources`: DSNs may carry TLS parameters.
sqlx = { workspace = true, features = ["postgres", "tls-rustls-ring-webpki"] }
async-trait.workspace = true
axum.workspace = true
# Replay derives the official `Turn.created_at` (Unix seconds) from the
# persisted RFC3339 item timestamp; the workspace already pins chrono.
chrono.workspace = true
futures.workspace = true
parking_lot.workspace = true
# OTLP/HTTP tracing, metrics and logs (stage 3). The SDK generation is pinned to
# `opentelemetry 0.28`, the version RivetKit already resolves in `Cargo.lock`.
# The async reqwest client plus the async-runtime processors are required:
# the default batch processors cannot drive an async HTTP client (0.28 only
# supports `reqwest-blocking-client` from their dedicated thread).
opentelemetry = { version = "0.28", default-features = false, features = ["trace", "metrics", "logs"] }
opentelemetry_sdk = { version = "0.28", default-features = false, features = [
    "trace",
    "metrics",
    "logs",
    "rt-tokio",
    "experimental_trace_batch_span_processor_with_async_runtime",
    "experimental_logs_batch_log_processor_with_async_runtime",
    "experimental_metrics_periodicreader_with_async_runtime",
] }
opentelemetry-otlp = { version = "0.28", default-features = false, features = [
    "http-proto",
    "reqwest-client",
    "trace",
    "metrics",
    "logs",
] }
# Bring the `HttpClient` trait into scope. The OTLP exporters get an explicit
# async `reqwest::Client`: RivetKit enables `reqwest-blocking-client` on the
# same unified `opentelemetry-otlp` package, and 0.28's built-in client
# selection then compiles neither branch (see `exporter::http::build_client`).
opentelemetry-http = { version = "0.28", default-features = false }
tracing-opentelemetry = { version = "0.29", default-features = false }
# Pinned to the engine generation verified in `.peri/plans/env-probe.md`
# (`Rivet 3.1.1`). 3.1.2-rc.1 is deliberately excluded.
rivetkit = "=3.1.1"
# `rivetkit-client` 3.1.1 exposes `ActorHandle::fetch` with reqwest 0.12 types;
# the workspace pins 0.13 for other crates, so the actor transport names its own.
reqwest = { version = "0.12", default-features = false, features = ["stream"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
# The process entry (`src/main.rs`) serves axum on a multi-thread runtime and
# waits for SIGINT; the library keeps the workspace's minimal feature set.
tokio = { workspace = true, features = ["net", "rt-multi-thread", "signal"] }
# `bootstrap` shares one CancellationToken between the gateway and the registry.
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["full", "test-util"] }
tower.workspace = true
